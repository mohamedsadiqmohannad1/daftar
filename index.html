<style>html{color-scheme:light dark}:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:14px system-ui,sans-serif;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: one narrow logbook column, today first; four views switched from a bottom bar. Instrument-panel numbers, petrol accent. */
:root{
  --bg:#eef2f3; --surface:#ffffff; --ink:#13232a; --muted:#5a6b72; --line:#d6dfe2;
  --accent:#0d6b7b; --accent-ink:#ffffff; --accent-soft:#d3e9ed; --warm:#b26f22;
  --good:#2c7a4c; --bad:#b0443a; --miss:#e2e8ea; --off:#f1f4f5;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1518; --surface:#142026; --ink:#e2ebee; --muted:#8ea1a9; --line:#23343b;
  --accent:#4cb2c3; --accent-ink:#06191d; --accent-soft:#17383f; --warm:#dfa257;
  --good:#5cbd82; --bad:#e2786a; --miss:#1c2a30; --off:#162329; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1518; --surface:#142026; --ink:#e2ebee; --muted:#8ea1a9; --line:#23343b;
  --accent:#4cb2c3; --accent-ink:#06191d; --accent-soft:#17383f; --warm:#dfa257;
  --good:#5cbd82; --bad:#e2786a; --miss:#1c2a30; --off:#162329; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
#app{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 8px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:0}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.sync.saving i{background:var(--warm)} .sync.err i{background:var(--bad)} .sync.local i{background:var(--muted)}

.view{display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-size:16px;font-weight:600}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.02em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* date bar */
.datebar{display:flex;align-items:center;gap:10px}
.datebar .d{flex:1;min-width:0}
.datebar .d h1{font-family:var(--f-display);font-weight:500;font-size:24px;line-height:1.3}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.chip-link{border:0;background:none;color:var(--accent);font-size:13px;padding:2px 0;font-weight:500}

/* today summary */
.summary{display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:8}
.ring .bgc{stroke:var(--miss)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.ring text{fill:var(--ink);font-family:var(--f-num);font-size:19px;font-weight:500}
.summary .big{font-family:var(--f-num);font-size:26px;font-weight:500}

/* habit rows */
.hlist{display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .15s,background .15s}
.hrow:hover{border-color:var(--accent)}
.hrow .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.hrow .box svg{width:16px;height:16px;stroke:var(--accent-ink);stroke-width:3;fill:none;opacity:0}
.hrow.on .box{background:var(--accent);border-color:var(--accent)}
.hrow.on .box svg{opacity:1}
.hrow .nm{flex:1;min-width:0;font-weight:500}
.hrow.on .nm{color:var(--muted)}
.hrow .st{font-size:12px;color:var(--muted);white-space:nowrap}
.hrow.dim{opacity:.7;border-style:dashed}

/* check-in */
.ci{display:flex;flex-direction:column;gap:14px}
.ci-row{display:flex;flex-direction:column;gap:6px}
.ci-row .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 0;font-family:var(--f-num);font-size:15px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper input{width:90px;text-align:center;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px;font-family:var(--f-num)}

/* habits view */
.hcard{display:flex;flex-direction:column;gap:12px}
.hhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hhead h3{font-size:16px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:0;border-inline-start:2px solid var(--line);padding-inline-start:10px}
.stat b{font-family:var(--f-num);font-weight:500;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:11px;gap:3px;direction:ltr;width:max-content}
.heat i{border-radius:3px;background:var(--off);display:block}
.heat i.s{background:var(--miss)} .heat i.d{background:var(--accent)} .heat i.x{background:transparent;outline:1px dashed var(--line);outline-offset:-1px} .heat i.n{background:transparent}
.heat-legend{display:flex;gap:12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.heat-legend span{display:inline-flex;align-items:center;gap:4px}
.heat-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* goals */
.bar{height:8px;border-radius:5px;background:var(--miss);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:5px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--good)} .pill.behind{color:var(--bad)} .pill.done{color:var(--accent)} .pill.nodata,.pill.over{color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 14px}
.kv div{display:flex;flex-direction:column}
.kv b{font-family:var(--f-num);font-weight:500}
.kv span{font-size:12px;color:var(--muted)}

/* charts */
.chart{direction:ltr;overflow-x:auto}
.chart svg{display:block}
.ax{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.grid{stroke:var(--line);stroke-width:1}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ln.a{stroke:var(--accent)} .ln.w{stroke:var(--warm)} .ln.t{stroke:var(--good);stroke-dasharray:5 4;stroke-width:1.5} .ln.p{stroke:var(--accent);stroke-dasharray:3 4;opacity:.7}
.dot.a{fill:var(--accent)} .dot.w{fill:var(--warm)}
.barr{fill:var(--accent)} .barr.cur{fill:var(--accent);opacity:.55}
.area{fill:var(--accent);opacity:.12}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--f-num);font-weight:500;font-size:24px}
.tile .delta{font-size:12px;font-family:var(--f-num)}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.insight{border-inline-start:3px solid var(--accent);padding:4px 12px 4px 0;padding-inline-start:12px}

/* empty */
.empty{display:flex;flex-direction:column;gap:14px}
.empty h2{font-family:var(--f-display);font-weight:500;font-size:20px}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:6px 14px}
.sugg button.added{border-style:solid;background:var(--accent-soft)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
nav.tabs button{border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--accent);font-weight:600}

/* sheet */
#sheet{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--ink) 35%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;
  padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
@media (min-width:640px){#sheet{align-items:center}.sheet-card{border-radius:18px}}
.sheet-card h2{font-family:var(--f-display);font-weight:500;font-size:20px;margin-bottom:14px}
form.f{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label,.fld .lbl2{font-size:13px;color:var(--muted)}
.fld input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
.fld input.ltr{direction:ltr;text-align:right;font-family:var(--f-num)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.daypick label{display:block}
.daypick input{position:absolute;opacity:0;pointer-events:none}
.daypick span{display:block;text-align:center;border:1px solid var(--line);border-radius:9px;padding:8px 0;font-size:14px}
.daypick input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daypick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.entries{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto}
.entries div{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line)}
.err{color:var(--bad);font-size:13px}
.banner{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.wd .l{font-size:11px;color:var(--muted)}
.wd .n{font-family:var(--f-num);font-size:15px;line-height:1}
.wd .m{width:22px;height:4px;border-radius:2px;background:var(--miss);overflow:hidden;direction:ltr}
.wd .m i{display:block;height:100%;background:var(--accent)}
.wd.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wd.today .l{color:var(--accent);font-weight:600}
.wd:disabled{opacity:.4;cursor:default}
/* 7-day dots on habit rows */
.dots{display:flex;gap:3px;flex:none}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--miss)}
.dots i.d{background:var(--accent)} .dots i.o{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.ltr{direction:ltr;unicode-bidi:isolate}
.tg,.cols{display:flex;flex-direction:column;gap:18px}
.tg-main,.tg-side{display:flex;flex-direction:column;gap:18px;min-width:0}
.delta{font-family:var(--f-body)!important}
.delta .num{font-family:var(--f-num)}
.tile b .u{font-family:var(--f-body);font-size:.6em;font-weight:400}.delta .u{font-size:1em}



.pts{font-family:var(--f-num);font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;white-space:nowrap;flex:none;font-weight:500}
h3 .pts{vertical-align:middle;margin-inline-start:4px}
.xrow{display:flex;gap:6px;align-items:stretch}
.xrow .hrow{flex:1;min-width:0}
.xrow .xdel{height:auto;align-self:stretch;width:44px;font-size:18px;color:var(--muted)}
.xrow .xdel svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
.xadd{display:flex;flex-direction:column;gap:10px}
.xadd input,.wform input:not(.datein){border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;width:100%;box-sizing:border-box}
.wform{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.wform .fld{flex:1;min-width:150px}
.wform .err{flex-basis:100%;margin:0}
.wlist{display:flex;flex-direction:column;padding:6px 10px}
.wrow{display:grid;grid-template-columns:1fr auto 64px;gap:12px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 4px;text-align:start}
.wrow:last-child{border-bottom:0}
.wrow.sel{background:var(--accent-soft);border-radius:8px}
.wrow .num:last-child{text-align:left}
.down-good{color:var(--good)} .up-bad{color:var(--bad)}
.ln.faint{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 4;opacity:.55}
.ln.thin{stroke-width:1.2;opacity:.45}
.ln.w{stroke-width:2.4}

.grp{display:flex;flex-direction:column;gap:8px}
.grp+.grp{margin-top:8px}
.grp-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grp-h h3{font-size:15px;font-weight:600;flex:1;min-width:0}
.gtog{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 0;text-align:start;color:var(--ink)}
.gtog svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;flex:none;color:var(--muted);transition:transform .2s ease}
.grp.closed .gtog svg{transform:rotate(90deg)}
.gname{font-size:15px;font-weight:600;min-width:0}
.grp.closed .gbar{opacity:.8}
.gsc{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.iconbtn.sm2{width:32px;height:32px;border-radius:8px;font-size:17px;color:var(--muted)}
.iconbtn.sm2 svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.gbar{height:3px;border-radius:2px;background:var(--miss);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--accent)}
.sel{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
.fld input#hf-gnew{margin-top:6px}
.nt-ed{gap:12px}
.nt-title{border:0;border-bottom:1px solid var(--line);background:transparent;font-family:var(--f-display);font-size:21px;padding:4px 0 8px;width:100%;box-sizing:border-box;border-radius:0}
.nt-title:focus-visible{outline:none;border-bottom-color:var(--accent)}
.nt-body{min-height:320px;background:transparent;border:0;padding:4px 0;font-size:16px}
.nt-body:focus-visible{outline:none}

.gear{width:36px;height:36px}
.gear svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.gate{max-width:460px;margin:24px auto 0;width:100%;box-sizing:border-box}
.gate h2{font-family:var(--f-display);font-weight:500;font-size:22px}
.gate input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
.code{font-family:var(--f-num);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0;overflow-x:auto}
.filebtn{position:relative;overflow:hidden;cursor:pointer;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.dbtns{display:flex;gap:16px;margin-top:2px}
.chip-link.on{color:var(--warm);font-weight:600}
.qrow{display:grid;grid-template-columns:1fr;gap:8px;cursor:default;text-align:start}
.qrow:hover{border-color:var(--line)}
.qtop{display:flex;align-items:center;gap:10px}
.qtop .nmw{flex:1}
.qctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qb{width:34px;height:34px;font-size:18px}
.qin{width:76px;text-align:center;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px;font-family:var(--f-num)}
.qt{font-size:12px;color:var(--muted)}
.qbar{height:5px;border-radius:3px;background:var(--miss);overflow:hidden;direction:ltr}
.qbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.qrow.on .qbar i{background:var(--good)}
.qrow.on .nm{color:var(--ink)}
.miss{font-size:11px;color:var(--warm);font-weight:600}
.dots i.p,.heat i.p{background:color-mix(in srgb,var(--accent) 45%,var(--miss))}
.seg2{display:inline-flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg2 label{position:relative}
.seg2 input{position:absolute;opacity:0;pointer-events:none}
.seg2 span{display:block;padding:6px 12px;border-radius:7px;font-size:13px;color:var(--muted);cursor:pointer}
.seg2 input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line);font-weight:600}
.seg2 input:focus-visible+span{outline:2px solid var(--accent)}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.qbox{display:flex;flex-direction:column;gap:12px;border:1px dashed var(--line);border-radius:12px;padding:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}

/* ---------- habit math ---------- */
// task kinds: binary (done / not), quantity (h.q = {t:target, u:unit, m:"min"|"max", s:step});
// frequency: fixed weekdays (h.days) or N times per week (h.wk)
const liveHabits=()=>S.habits.filter(h=>!h.archived);
const hStart=h=>h.created||todayK();
const isQ=h=>!!(h.q&&+h.q.t>0);
const isWk=h=>+h.wk>0;
const isOff=k=>!!(S.days[k]&&S.days[k].off);
const rawV=(h,k)=>{const d=S.days[k];return d&&d.h?d.h[h.id]:undefined};
const entered=(h,k)=>{const v=rawV(h,k);if(v===undefined||v===null||v===false)return false;return isQ(h)?Number.isFinite(+v):!!v};
function frac(h,k){
  if(!entered(h,k))return 0;
  if(!isQ(h))return 1;
  const n=+rawV(h,k),t=+h.q.t;
  if(h.q.m==="max")return n<=t?1:Math.max(0,1-(n-t)/t); // full credit under the limit, falls to zero at twice the limit
  return Math.max(0,Math.min(1,n/t));
}
const isDone=(h,k)=>frac(h,k)>=1;
const hPts=h=>{const p=+h.pts;return Number.isFinite(p)&&p>0?p:10};
const earned=(h,k)=>Math.round(hPts(h)*frac(h,k)*10)/10;
const isSched=(h,k)=>{if(isWk(h)||isOff(k))return false;return !h.days||!h.days.length||h.days.length===7||h.days.includes(dow(k))};
const activeOn=(h,k)=>hStart(h)<=k&&(!h.archived||(h.archivedAt&&h.archivedAt>k));
const wlink=h=>h.wl===true||(h.wl===undefined&&/الوزن/.test(h.name||""));
function scoreOf(items,k){
  let got=0,max=0;
  items.forEach(h=>{if(!activeOn(h,k))return;const p=hPts(h),e=earned(h,k);if(isSched(h,k))max+=p;else if(e>0)max+=e;got+=e});
  return {got:Math.round(got*10)/10,max:Math.round(max*10)/10};
}
function weekCount(h,ws){let c=0;const t=todayK();for(let i=0;i<7;i++){const d=addD(ws,i);if(d>t)break;if(isDone(h,d))c++}return c}
function curStreak(h){
  const t=todayK(),st=hStart(h);
  if(isWk(h)){let ws=weekStartK(t),n=0;if(weekCount(h,ws)<+h.wk)ws=addD(ws,-7);
    for(let i=0;i<500&&addD(ws,6)>=st;i++,ws=addD(ws,-7)){if(weekCount(h,ws)>=+h.wk)n++;else break}return n}
  let k=t,n=0;if(isSched(h,k)&&!isDone(h,k))k=addD(k,-1);
  for(let i=0;i<2000&&k>=st;i++,k=addD(k,-1)){if(!isSched(h,k))continue;if(isDone(h,k))n++;else break}
  return n;
}
function bestStreak(h){
  const t=todayK();let run=0,best=0;
  if(isWk(h)){for(let ws=weekStartK(hStart(h)),i=0;ws<=t&&i<600;ws=addD(ws,7),i++){const ok=weekCount(h,ws)>=+h.wk;if(ok){run++;best=Math.max(best,run)}else if(ws!==weekStartK(t))run=0}return best}
  let k=hStart(h);
  for(let i=0;i<3000&&k<=t;i++,k=addD(k,1)){if(!isSched(h,k))continue;if(isDone(h,k)){run++;best=Math.max(best,run)}else if(k!==t)run=0}
  return best;
}
function rateRange(h,a,b){ // share of what was asked that got done, a..b inclusive
  const t=todayK();if(a<hStart(h))a=hStart(h);if(b>t)b=t;if(a>b)return NaN;
  if(isWk(h)){let need=0,got=0;for(let ws=weekStartK(a);ws<=b;ws=addD(ws,7)){const c=weekCount(h,ws);if(ws===weekStartK(t)&&c<+h.wk)continue;need+= +h.wk;got+=Math.min(c,+h.wk)}return need?got/need:NaN}
  let s=0,d=0;
  for(let k=a;k<=b;k=addD(k,1)){if(!isSched(h,k))continue;const f=frac(h,k);if(k===t&&f<1)continue;s++;d+=f}
  return s?d/s:NaN;
}
const hRate=(h,n)=>rateRange(h,addD(todayK(),-(n-1)),todayK());
function strength(h){ // habit strength 0-100: each repetition strengthens, each miss weakens, a long record cushions one miss
  const t=todayK(),st=hStart(h);let s=0;
  if(isWk(h)){const m=Math.pow(.5,1/4),cw=weekStartK(t);for(let ws=weekStartK(st);ws<=cw;ws=addD(ws,7)){const c=weekCount(h,ws);if(ws===cw&&c<+h.wk)break;s=s*m+Math.min(1,c/+h.wk)*(1-m)}return Math.round(s*100)}
  const m=Math.pow(.5,1/13);
  for(let k=st;k<=t;k=addD(k,1)){if(!isSched(h,k))continue;const f=frac(h,k);if(k===t&&f<1)continue;s=s*m+f*(1-m)}
  return Math.round(s*100);
}
function missedYesterday(h,k){
  if(isWk(h)||k!==todayK())return false;const y=addD(k,-1);
  return y>=hStart(h)&&isSched(h,y)&&!isDone(h,y)&&isSched(h,k)&&!isDone(h,k);
}
function weakDay(h){ // weekday with the lowest completion over the last 8 weeks
  if(isWk(h))return null;const t=todayK(),c={};
  for(let i=1;i<=56;i++){const k=addD(t,-i);if(k<hStart(h)||!isSched(h,k))continue;const w=dow(k);c[w]=c[w]||[0,0];c[w][0]++;c[w][1]+=frac(h,k)}
  let worst=null;Object.keys(c).forEach(w=>{const r=c[w][1]/c[w][0];if(c[w][0]>=3&&(!worst||r<worst.r))worst={w:+w,r:r}});
  return worst&&worst.r<0.8?worst:null;
}
function firstLogKey(){
  let f=null;S.habits.forEach(h=>{if(h.created&&(!f||h.created<f))f=h.created});
  Object.keys(S.days).forEach(k=>{if(!f||k<f)f=k});return f;
}
function schedText(h){
  if(isWk(h))return +h.wk+" "+(+h.wk===1?"مرة":+h.wk===2?"مرتان":"مرات")+" في الأسبوع";
  if(!h.days||!h.days.length||h.days.length===7)return "كل يوم";
  return DAYS_ORDER.filter(d=>h.days.includes(d)).map(d=>DAY_NAME[d]).join("، ");
}
const qText=h=>(h.q.m==="max"?"حد أقصى ":"الهدف ")+num(+h.q.t,2)+(h.q.u?" "+h.q.u:"");

/* ---------- goal math ---------- */
function gStats(g){
  const pts=[{d:g.startDate,v:+g.start}].concat((g.entries||[]).map(e=>({d:e.d,v:+e.v}))).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  const last=pts[pts.length-1],cur=last.v,span=g.target-g.start,dir=Math.sign(span)||1;
  const prog=span===0?1:(cur-g.start)/span;
  const reached=dir>0?cur>=g.target:cur<=g.target;
  const t=todayK(),daysLeft=diffD(t,g.deadline);
  const need=(g.target-cur)/Math.max(daysLeft,1)*7;
  const win=pts.filter(p=>diffD(p.d,last.d)<=28);
  let slope=null;
  if(win.length>=2&&diffD(win[0].d,last.d)>=3){
    const xs=win.map(p=>diffD(win[0].d,p.d)),ys=win.map(p=>p.v),mx=avg(xs),my=avg(ys);
    let nu=0,de=0;xs.forEach((x,i)=>{nu+=(x-mx)*(ys[i]-my);de+=(x-mx)*(x-mx)});
    if(de>0)slope=nu/de;
  }
  const proj=slope==null?null:cur+slope*Math.max(diffD(last.d,g.deadline),0);
  let status;
  if(reached)status="done";else if(daysLeft<0)status="over";else if(slope==null)status="nodata";
  else status=(dir>0?proj>=g.target:proj<=g.target)?"ok":"behind";
  return {pts:pts,last:last,cur:cur,prog:prog,daysLeft:daysLeft,need:need,slope:slope,proj:proj,status:status,dir:dir};
}

/* generic interactive daily curve: o={st,n,pts:[{i,k,v,mark}],yMin,yMax,yTicks,zero,area,faint:[[i,v]],avg:[[i,v]],sel,tip(p),onPick(k),empty,thin} */
function curve(box,o){
  const W=Math.max(260,Math.floor(box.clientWidth)),H=W<520?230:290,P={l:46,r:14,t:14,b:28},iw=W-P.l-P.r,ih=H-P.t-P.b;
  const n=Math.max(1,o.n),X=i=>P.l+i/n*iw,Y=v=>P.t+(o.yMax-v)/(o.yMax-o.yMin)*ih,pts=o.pts;
  const t=todayK();
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||"")+'">';
  o.yTicks.forEach(tk=>{s+='<line class="'+(o.zero!=null&&tk[0]===o.zero?"zero":"grid")+'" x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+Y(tk[0]).toFixed(1)+'" y2="'+Y(tk[0]).toFixed(1)+'"/><text class="ax" x="'+(P.l-6)+'" y="'+(Y(tk[0])+4).toFixed(1)+'" text-anchor="end">'+esc(tk[1])+'</text>'});
  const cnt=Math.max(1,Math.min(n,Math.floor(iw/72)));
  for(let j=0;j<=cnt;j++){const i=Math.round(j*n/cnt),anc=j===0?"start":j===cnt?"end":"middle";s+='<text class="ax" x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+anc+'">'+fNum(addD(o.st,i))+'</text>'}
  const si=o.sel?diffD(o.st,o.sel):-1;
  if(si>=0&&si<=n)s+='<line class="selln" x1="'+X(si).toFixed(1)+'" x2="'+X(si).toFixed(1)+'" y1="'+P.t+'" y2="'+(P.t+ih)+'"/>';
  (o.hlines||[]).forEach(hl=>{s+='<line class="ln '+hl.cls+'" x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+Y(hl.y).toFixed(1)+'" y2="'+Y(hl.y).toFixed(1)+'"/>'});
  if(o.faint&&o.faint.length>1)s+='<polyline class="ln faint" points="'+o.faint.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")+'"/>';
  if(pts.length>1){
    if(o.area!=null)s+='<path class="area" d="M'+X(pts[0].i).toFixed(1)+' '+Y(o.area).toFixed(1)+pts.map(p=>' L'+X(p.i).toFixed(1)+' '+Y(p.v).toFixed(1)).join("")+' L'+X(pts[pts.length-1].i).toFixed(1)+' '+Y(o.area).toFixed(1)+' Z"/>';
    s+='<polyline class="ln a'+(o.thin?" thin":"")+'" points="'+pts.map(p=>X(p.i).toFixed(1)+","+Y(p.v).toFixed(1)).join(" ")+'"/>';
  }
  if(o.avg&&o.avg.length>1)s+='<polyline class="ln w" points="'+o.avg.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")+'"/>';
  const r=n>200?2:n>100?2.6:3.2;
  pts.forEach(p=>{if(p.mark)s+='<circle class="notedot" cx="'+X(p.i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(r+2.2)+'"/>';else s+='<circle class="dot a" cx="'+X(p.i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+r+'"/>'});
  const sp=pts.find(p=>p.k===o.sel);if(sp)s+='<circle class="selring" cx="'+X(sp.i).toFixed(1)+'" cy="'+Y(sp.v).toFixed(1)+'" r="'+(r+6)+'"/>';
  s+='</svg>';
  box.innerHTML='<div class="mem-svg">'+s+'<div class="tip" hidden></div>'+(pts.length?"":'<div class="mem-empty">'+esc(o.empty||"لا توجد بيانات في هذه الفترة.")+'</div>')+'</div>';
  const svg=box.querySelector("svg"),tip=box.querySelector(".tip");
  const near=ev=>{const rc=svg.getBoundingClientRect(),x=(ev.clientX-rc.left)*(W/rc.width);let best=null,bd=1e9;
    pts.forEach(p=>{const dx=Math.abs(X(p.i)-x);if(dx<bd){bd=dx;best=p}});
    const di=Math.max(0,Math.min(n,Math.round((x-P.l)/iw*n)));return {p:bd<=16?best:null,k:addD(o.st,di)}};
  const show=p=>{tip.innerHTML=o.tip(p);tip.hidden=false;const tw=tip.offsetWidth,th=tip.offsetHeight;
    tip.style.left=Math.max(0,Math.min(W-tw,X(p.i)-tw/2))+"px";tip.style.top=Math.max(0,Y(p.v)-th-14)+"px"};
  svg.addEventListener("pointermove",ev=>{if(ev.pointerType==="touch")return;const q=near(ev);if(q.p)show(q.p);else tip.hidden=true});
  svg.addEventListener("pointerleave",ev=>{if(ev.pointerType!=="touch")tip.hidden=true});
  svg.addEventListener("click",ev=>{const q=near(ev),k=q.p?q.p.k:q.k;if(k<=t&&o.onPick)o.onPick(k)});
  if(sp&&o.pinTip)show(sp);
}

function weightTrend(){ // kg per day from readings of the last 28 days
  const keys=wKeys();if(keys.length<4)return null;const last=keys[keys.length-1];
  const win=keys.filter(k=>diffD(k,last)<=28);if(win.length<4||diffD(win[0],last)<10)return null;
  const xs=win.map(k=>diffD(win[0],k)),ys=win.map(k=>S.days[k].w),mx=avg(xs),my=avg(ys);let nu=0,de=0;
  xs.forEach((x,i)=>{nu+=(x-mx)*(ys[i]-my);de+=(x-mx)*(x-mx)});return de>0?nu/de:null;
}
function weightGoalHTML(){

    else{const days=Math.round(rem/sl),eta=addD(t,days);msg="باقٍ "+L(num(Math.abs(rem),1))+" كغم. بمعدلك الحالي ("+L(signed(sl*7,2))+" كغم أسبوعياً، من قراءات آخر 4 أسابيع) تصل إليه في حوالي "+esc(fFull(eta))+"، بعد "+Math.max(1,Math.round(days/7))+" أسبوعاً تقريباً."}

function vGymAn(){
  const keys=anKeys();
  let s='<section class="sec-h"><h2 class="dsp">تحليل الأداء</h2><button class="btn sm" data-act="gview" data-v="">رجوع</button></section>';
  if(!keys.length)return s+'<section class="panel empty"><h2>لا توجد جلسات بعد</h2><p class="muted small" style="margin:0">بعد أن تسجّل جلساتك تظهر هنا منحنيات قوتك وحجمك ومدى وصولك للفشل في كل تمرين.</p></section>';
  if(!keys.some(k=>k[0]===S.anEx))S.anEx=keys[0][0];
  const eid=keys.find(k=>k[0]===S.anEx)[1],d=fatigue(eid,S.anEx),h=exHistory(eid,S.anEx).slice().reverse(),d0=h[0].w.date;
  const rows=h.map(x=>{const ss=x.e.sets,rs=ss.filter(hasRir);return {k:x.w.date,x:diffD(d0,x.w.date),E:sessStrength(ss,d),top:Math.max.apply(null,ss.map(q=>+q.w||0)),vol:ss.reduce((a,q)=>a+(+q.w||0)*(+q.r||0),0),rir:rs.length?avg(rs.map(q=>+q.rir)):null}}).filter(r=>r.E>0);
  const last=rows[rows.length-1],best=rows.reduce((a,r)=>r.E>a.E?r:a,rows[0]),rg=regress(rows.filter(r=>diffD(r.k,todayK())<=90).map(r=>[r.x,r.E]));
  const mPct=rg&&last?rg.b*30/last.E*100:null,rr=rows.filter(r=>r.rir!==null).slice(-3),rAvg=rr.length?avg(rr.map(r=>r.rir)):null;
  s+='<section class="panel sec"><div class="fld"><label for="an-ex">التمرين</label><select id="an-ex" class="sel">'+keys.map(k=>'<option value="'+esc(k[0])+'"'+(k[0]===S.anEx?" selected":"")+'>'+esc(k[0])+'</option>').join("")+'</select></div>'+
    '<div class="kv"><div><b>'+L(num(last.E,1))+'</b><span>القوة المقدّرة الآن (كغم)</span></div><div><b>'+(mPct===null?"–":L(signed(mPct,1)+"%"))+'</b><span>التقدم الشهري</span></div>'+
    '<div><b>'+L(num(best.E,1))+'</b><span>أفضل قوة · '+esc(fShort(best.k))+'</span></div><div><b>'+(rAvg===null?"–":L(num(rAvg,1)))+'</b><span>متوسط العدات الباقية، آخر 3 جلسات</span></div></div>'+
    '<p class="lbl" style="margin:0">القوة المقدّرة هي أقصى وزن تقدر عليه لتكرار واحد، محسوبة من الوزن والعدات والعدات الباقية. التقدم الشهري من اتجاه آخر 90 يوماً. العدات الباقية: صفر يعني وصلت للفشل.</p></section>';
  s+='<section class="panel sec"><div class="sec-h"><h2>القوة المقدّرة</h2><span class="lbl">'+rows.length+' جلسة</span></div>'+exChart(rows.map(r=>[r.x,r.E,r.k]),{trend:true,label:"القوة المقدّرة"})+'<div class="legend"><span><i style="background:var(--accent)"></i>كل جلسة</span><span><i style="background:var(--accent);opacity:.6"></i>الاتجاه</span></div></section>';
  s+='<div class="cols"><section class="panel sec"><div class="sec-h"><h2>أثقل جولة</h2><span class="lbl">كغم</span></div>'+exChart(rows.map(r=>[r.x,r.top,r.k]),{label:"أثقل جولة"})+'</section>'+
    '<section class="panel sec"><div class="sec-h"><h2>حجم الجلسة</h2><span class="lbl">كغم × عدات</span></div>'+exChart(rows.map(r=>[r.x,r.vol,r.k]),{cls:"w",label:"حجم الجلسة",y0:0})+'</section></div>';
  const rp=rows.filter(r=>r.rir!==null);
  s+='<section class="panel sec"><div class="sec-h"><h2>قربك من الفشل</h2><span class="lbl">متوسط العدات الباقية · الأقل أفضل لهدفك</span></div>'+
    (rp.length?exChart(rp.map(r=>[r.x,r.rir,r.k]),{cls:"w",y0:0,y1:4,label:"متوسط العدات الباقية"}):'<p class="muted small" style="margin:0">يظهر هذا المنحنى بعد أن تقيّم العدات الباقية في جولاتك.</p>')+'</section>';
  // weekly, by day group
  const cw=weekStartK(todayK()),weeks=[];for(let i=11;i>=0;i--)weeks.push(addD(cw,-7*i));
  const ws=doneWos(),gids=[...new Set(ws.map(w=>w.gid))].filter(id=>findG(id));
  const series=gids.map(id=>({c:gColorId(id),name:findG(id).name,v:weeks.map(wk=>ws.filter(w=>w.gid===id&&weekStartK(w.date)===wk).reduce((a,w)=>a+woVol(w),0)/1000)}));
  const cnt=weeks.map(wk=>new Set(ws.filter(w=>weekStartK(w.date)===wk).map(w=>w.date)).size);
  s+='<section class="panel sec"><div class="sec-h"><h2>الحجم الأسبوعي لكل يوم</h2><span class="lbl">طن · 12 أسبوعاً</span></div>'+(series.length?multiLines(weeks,series,"الحجم الأسبوعي")+'<div class="legend">'+series.map(x=>'<span><i style="background:'+x.c+'"></i>'+esc(x.name)+'</span>').join("")+'</div>':'<p class="muted small" style="margin:0">لا جلسات في آخر 12 أسبوعاً.</p>')+'</section>';
  s+='<section class="panel sec"><div class="sec-h"><h2>أيام التمرين في الأسبوع</h2><span class="lbl">الخط المنقط هدفك ('+gymWk()+')</span></div>'+countBars(weeks,cnt,gymWk(),"أيام التمرين")+'</section>';
  return s;
}

// for the comparison only the day's scheduled fixed tasks count: no pending tasks, no extra unscheduled or weekly tasks, no excused days
function fairDay(k){
  if(isOff(k))return null;let got=0,max=0,n=0;
  S.habits.forEach(h=>{if(!activeOn(h,k)||!isSched(h,k))return;max+=hPts(h);got+=earned(h,k);n++});
  return max>0?{p:Math.min(100,Math.round(got/max*1000)/10),n:n,m:Math.round(max*10)/10}:null;
}
function dayPct(k){const f=fairDay(k);return f?f.p:null}
function shareData(){
  const fk=firstLogKey(),t=todayK(),o={pct:{},pn:{},pm:{}};if(!fk)return o;
  let k=fk>addD(t,-400)?fk:addD(t,-400);for(;k<=t;k=addD(k,1)){const f=fairDay(k);if(f){o.pct[k]=f.p;o.pn[k]=f.n;o.pm[k]=f.m}}
  return o;
}

function stopFriends(){Object.keys(FR_UNS).forEach(u=>{try{FR_UNS[u]&&FR_UNS[u]()}catch(e){}});FR_UNS={};S.fr={}}
const objOr=x=>x&&typeof x==="object"&&!Array.isArray(x)?x:null;
function watchFriends(){

  const want=new Set(S.cmp.map(c=>c.uid));
  Object.keys(FR_UNS).forEach(u=>{if(!want.has(u)){try{FR_UNS[u]&&FR_UNS[u]()}catch(e){}delete FR_UNS[u];delete S.fr[u]}});
  want.forEach(u=>{if(FR_UNS[u])return;
    FR_UNS[u]=DB.shareWatch(u,d=>{S.fr[u]=d?{pct:objOr(d.pct)||{},pn:objOr(d.pn),pm:objOr(d.pm),updated:d.updated||""}:{none:true};if((S.tab==="habits"&&CMP_ON)||S.tab==="today")render();refreshSettings()},
      e=>{S.fr[u]={err:(e&&e.code)||"err"};FR_UNS[u]=null;if(S.tab==="habits"&&CMP_ON)render();refreshSettings();setTimeout(()=>{if(FR_UNS[u]===null){delete FR_UNS[u];watchFriends()}},60000)})});
}
function frStatus(c){

}

/* comparison view */
S.cmpV={r:"7",adj:(()=>{try{return localStorage.getItem("dt-cmpadj")!=="0"}catch(e){return true}})()};
const numOk=v=>v!==null&&v!==undefined&&v!==""&&Number.isFinite(+v);
function cmpPeople(){
  const me={name:"أنت",cls:"a",me:true,hasN:true,hasM:true,pct:k=>dayPct(k),n:k=>{const f=fairDay(k);return f?f.n:null},m:k=>{const f=fairDay(k);return f?f.m:null}};
  return [me].concat(S.cmp.map((c,i)=>{const f=S.fr[c.uid]||{};return {name:c.name,cls:FR_CLS[i%FR_CLS.length],c:c,hasN:!!f.pn,hasM:!!f.pm,
    pct:k=>f.pct&&numOk(f.pct[k])?+f.pct[k]:null,n:k=>f.pn&&numOk(f.pn[k])?+f.pn[k]:null,m:k=>f.pm&&numOk(f.pm[k])?+f.pm[k]:null}}));
}
function cmpDays(){const t=todayK(),n=+S.cmpV.r||7,ks=[];for(let i=n-1;i>=0;i--)ks.push(addD(t,-i));return ks}
function cmpTable(people,rows){
  // rows: [label, fn(person) -> {v, t}, true = higher is better, false = lower is better, null = no winner]
  return '<div class="ctbl" style="--np:'+people.length+'"><div class="ctr cth"><span></span>'+people.map(p=>'<span class="ctp"><i class="cmpdot '+p.cls+'"></i><bdi>'+esc(p.name)+'</bdi></span>').join("")+'</div>'+
    rows.map(r=>{const cells=people.map(p=>r[1](p)),vs=cells.map(c=>c&&numOk(c.v)?+c.v:null).filter(v=>v!==null),hb=r[2]===undefined?true:r[2];
      const best=vs.length>1&&hb!==null?(hb===false?Math.min.apply(null,vs):Math.max.apply(null,vs)):null,tie=vs.filter(v=>v===best).length>1;
      return '<div class="ctr"><span class="ctl">'+r[0]+'</span>'+cells.map(c=>'<span class="num'+(best!==null&&!tie&&c&&+c.v===best?" best":"")+'">'+(c&&c.t!=null?c.t:"–")+'</span>').join("")+'</div>'}).join("")+'</div>';
}
// adjusted score: the % scaled by the square root of the day's load (sum of the scheduled tasks' points) relative to the heaviest day among you,
// halfway between the plain % (unfair to the one with the heavier day) and the points earned (unfair to the one with the lighter day).
// Wins always use the adjusted score, whatever view is chosen; the task count is the fallback until a friend's app publishes points.
function cmpScores(people,ks){
  const basis=people.every(p=>p.hasM)?"m":people.every(p=>p.hasN)?"n":"";
  people.forEach(p=>{p.raw=ks.map(k=>p.pct(k));p.nn=ks.map(k=>p.n(k));p.mm=ks.map(k=>p.m(k));p.a=[]});
  ks.forEach((k,i)=>{const L2=p=>basis==="m"?p.mm[i]:basis==="n"?p.nn[i]:null,ls=people.map(L2).filter(numOk),mx=ls.length?Math.max.apply(null,ls):0;
    people.forEach(p=>{const v=p.raw[i],l=L2(p);p.a[i]=!numOk(v)?null:basis&&numOk(l)&&mx>0?Math.round(v*Math.sqrt(l/mx)*10)/10:v})});
  const adj=S.cmpV.adj&&!!basis;
  people.forEach(p=>{p.v=adj?p.a:p.raw;p.ok=p.v.filter(numOk)});
  return {adj:adj,basis:basis};
}
/* weekly match: Saturday to Friday, decided by the average adjusted score of the week */
function pairDay(me,fr,k){
  const basis=fr.hasM?"m":fr.hasN?"n":"",a=me.pct(k),b=fr.pct(k);
  const la=basis==="m"?me.m(k):basis==="n"?me.n(k):null,lb=basis==="m"?fr.m(k):basis==="n"?fr.n(k):null,mx=Math.max(numOk(la)?la:0,numOk(lb)?lb:0);
  const adj=(v,l)=>!numOk(v)?null:basis&&numOk(l)&&mx>0?v*Math.sqrt(l/mx):v;
  return [adj(a,la),adj(b,lb)];
}
const MIN_DAYS=3;
function matchWeeks(me,fr){
  const t=todayK(),cw=weekStartK(t),f=S.fr[fr.c.uid]||{},fks=Object.keys(f.pct||{}).sort(),mk=firstLogKey();
  if(!fks.length||!mk)return null;
  let w=weekStartK(fks[0]>mk?fks[0]:mk);if(w<addD(cw,-7*52))w=addD(cw,-7*52);
  const out=[];
  for(;w<=cw;w=addD(w,7)){const sa=[],sb=[];let days=0;
    for(let i=0;i<7;i++){const k=addD(w,i);if(k>t)break;days++;const x=pairDay(me,fr,k);if(numOk(x[0]))sa.push(x[0]);if(numOk(x[1]))sb.push(x[1])}
    const A=sa.length?avg(sa):null,B=sb.length?avg(sb):null,live=w===cw,ok=sa.length>=MIN_DAYS&&sb.length>=MIN_DAYS;
    out.push({w:w,A:A,B:B,na:sa.length,nb:sb.length,live:live,left:live?6-diffD(w,t):0,res:ok?(Math.abs(A-B)<0.5?"d":A>B?"w":"l"):null});
  }
  return out;
}
function matchRecord(ws){
  const done=ws.filter(x=>!x.live&&x.res),r={w:0,l:0,d:0,streak:0,sres:null};
  done.forEach(x=>{r[x.res]++});
  for(let i=done.length-1;i>=0;i--){const x=done[i];if(x.res==="d")break;if(r.sres===null)r.sres=x.res;if(x.res!==r.sres)break;r.streak++}
  return r;
}
const rnd=v=>numOk(v)?Math.round(v):"–";
function liveLine(cur,fname){
  if(!cur||!numOk(cur.A)||!numOk(cur.B))return "المباراة تبدأ حين يسجّل كل منكما نقاطاً هذا الأسبوع.";
  const d=Math.round(cur.A)-Math.round(cur.B),left=cur.left===0?"آخر يوم في الأسبوع":"باقي "+cur.left+" "+(cur.left===1?"يوم":cur.left===2?"يومان":"أيام");
  return (d>0?"متقدّم بـ"+d:d<0?"متأخر بـ"+(-d):"متعادلان")+" · "+left+(cur.na<MIN_DAYS||cur.nb<MIN_DAYS?" · تحتاج المباراة "+MIN_DAYS+" أيام مسجلة لكل منكما":"");
}

/* ---------- steps from the iPhone Health app ---------- */
// An iOS shortcut writes the day's step total to hk/{id} through the public Firestore REST API, without signing in.
// {id} is a random 32-character code kept in this user's private settings. The document holds only {v:{date:steps}},
// so anyone who learns the code can see or change step counts and nothing else.
let HK_UN=null,HK_ID="",HK_ERR="",HK_LAST=null,HK_RT=null;
const hkDig=s=>String(s==null?"":s).replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/[۰-۹]/g,c=>"۰۱۲۳۴۵۶۷۸۹".indexOf(c));
// the phone may format the date and the number with its own digits and separators
function hkKey(s){
  const m=hkDig(s).match(/(\d{4})\D{1,3}(\d{1,2})\D{1,3}(\d{1,2})/);if(!m)return null;
  const k=m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  return /^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(k)?k:null;
}
function hkNum(s){
  const t=hkDig(s).replace(/٫/g,".").replace(/[\s  ‏‎٬,'’]/g,""),m=t.match(/\d+(?:\.\d+)?/);if(!m)return null;
  let x=m[0];if(/^\d{1,3}(\.\d{3})+$/.test(x))x=x.replace(/\./g,"");
  const v=Math.round(+x);return Number.isFinite(v)&&v>=0&&v<=150000?v:null;
}
function hkApply(doc){
  const v=doc&&doc.v&&typeof doc.v==="object"?doc.v:{},t=todayK(),lim=addD(t,1),old=addD(t,-40);
  let last=null,ch=false;const drop=[];
  Object.keys(v).forEach(raw=>{
    const k=hkKey(raw),n=hkNum(v[raw]);
    if(!k||k<old){drop.push(raw);return}
    if(n==null||k>lim)return;
    if(!last||k>last.k)last={k:k,n:n};
    const cur=S.nutri[k];if(cur&&Math.round(+cur.hk||0)===n)return;if(!cur&&!(n>0))return;
    const d=nDay(k);if(n>0)d.hk=n;else delete d.hk;saveN(k);syncStepsHabit(k);ch=true;
  });
  HK_LAST=last;
  if(drop.length&&DB&&DB.rawSet&&HK_ID){const nv={};Object.keys(v).forEach(r=>{if(!drop.includes(r))nv[r]=String(v[r])});DB.rawSet("hk/"+HK_ID,{v:nv}).catch(()=>{})}
  if(ch)render();else hkRefresh();
}
function stopHK(){clearTimeout(HK_RT);try{HK_UN&&HK_UN()}catch(e){}HK_UN=null;HK_ID="";HK_ERR="";HK_LAST=null}
function watchHK(){
  const id=S.nut&&typeof S.nut.hk==="string"?S.nut.hk:"";
  if(!DB||!DB.rawWatch||S.mode==="local"||!id){if(HK_ID||HK_UN)stopHK();return}
  if(id===HK_ID&&HK_UN)return;
  stopHK();HK_ID=id;
  HK_UN=DB.rawWatch("hk/"+id,d=>{HK_ERR="";hkApply(d)},e=>{
    HK_ERR=(e&&e.code)||"err";HK_UN=null;hkRefresh();
    HK_RT=setTimeout(()=>{if(HK_ID===id&&!HK_UN){HK_ID="";watchHK()}},60000);
  });
}
function hkNewId(){const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,"0")).join("")}
function hkURL(){const c=getCfg()||{};return "https://firestore.googleapis.com/v1/projects/"+(c.projectId||"")+"/databases/(default)/documents/hk/"+(S.nut&&S.nut.hk||"")+"?key="+(c.apiKey||"")+"&updateMask.fieldPaths=v.%60"}

    '</ol></details>'+
    '<p class="lbl" style="margin:0">الرقم الذي تكتبه بيدك في يوم ما يتقدم على رقم الصحة. الرابط فيه رمز خاص بك: من يحصل عليه يستطيع رؤية خطواتك أو تغييرها فقط، ولا يصل لباقي بياناتك. إن تسرّب، أنشئ رمزاً جديداً وحدّث الرابط في الاختصار.</p>'+

  if(a==="hkOn"){N.hk=hkNewId();saveConfig();watchHK();render(true);return true}
  if(a==="hkNew"){arm("hkNew",b.textContent,()=>{const o=N.hk;N.hk=hkNewId();saveConfig();if(o&&DB&&DB.rawDel)DB.rawDel("hk/"+o).catch(()=>{});watchHK();render(true)});return true}
  if(a==="hkOff"){arm("hkOff",b.textContent,()=>{const o=N.hk;delete N.hk;saveConfig();if(o&&DB&&DB.rawDel)DB.rawDel("hk/"+o).catch(()=>{});stopHK();render(true)});return true}

function openHabit(h,pg){

    const err=$("#hf-err"),bad=m=>{err.textContent=m;err.hidden=false};

    if(!Number.isFinite(pts)||pts<1||pts>1000)return bad("النقاط رقم صحيح من 1 إلى 1000.");
    const kind=fd.get("kind"),fr=fd.get("fr");let q=null,wk=0;
    if(kind==="q"){const qt=parseFloat(fd.get("qt")),qs=parseFloat(fd.get("qs"));
      if(!Number.isFinite(qt)||qt<=0)return bad("أدخل الهدف أو الحد رقماً أكبر من صفر.");
      q={t:qt,u:String(fd.get("qu")||"").trim(),m:fd.get("qm")==="max"?"max":"min",s:Number.isFinite(qs)&&qs>0?qs:1}}
    if(fr==="wk"){wk=parseInt(fd.get("wk"),10);if(!Number.isFinite(wk)||wk<1||wk>7)return bad("عدد المرات في الأسبوع من 1 إلى 7.")}
    else if(!days.length)return bad("اختر يوماً واحداً على الأقل.");
    let gid=String(fd.get("g")||"");
    if(gid==="__new"){const gn=String(fd.get("gnew")||"").trim();if(!gn)return bad("اكتب اسم المجموعة الجديدة.");const ng={id:uid(),name:gn};S.groups.push(ng);gid=ng.id}
    const cur=h&&S.habits.find(x=>x.id===h.id);if(h&&!cur){closeSheet();render();return}
    const tgt=cur||addHabit(name,days,pts);if(!tgt)return;
    tgt.name=name;tgt.pts=pts;tgt.days=fr==="wk"?[]:(days.length===7?[]:days);

}

async function applyImport(o){
  const clone=x=>JSON.parse(JSON.stringify(x));const ops=[];
  if(Array.isArray(o.groups)){const ids=new Set(S.groups.map(g=>g.id));o.groups.forEach(g=>{if(g&&g.id&&!ids.has(g.id))S.groups.push(clone(g))})}
  if(Array.isArray(o.habits)){o.habits.forEach(h=>{if(!h||!h.id)return;const i=S.habits.findIndex(x=>x.id===h.id);if(i>=0)S.habits[i]=clone(h);else S.habits.push(clone(h))})}
  if(+o.wgoal>0&&!(+S.wgoal>0))S.wgoal=+o.wgoal;ops.push({path:"app/config",data:cfgDoc()});
  if(o.days&&typeof o.days==="object")Object.keys(o.days).forEach(k=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return;const v=clone(o.days[k]),cur=S.days[k]||{};
    S.days[k]=Object.assign({},cur,v,{d:k,h:Object.assign({},cur.h||{},v.h||{})});ops.push({path:"days/"+k,data:S.days[k]})});
  if(o.goals&&typeof o.goals==="object")Object.keys(o.goals).forEach(id=>{S.goals[id]=clone(o.goals[id]);ops.push({path:"goals/"+id,data:S.goals[id]})});
  if(o.gym&&Array.isArray(o.gym.groups)){const inc=o.gym.groups.filter(g=>g&&g.id).map(clone),ids=new Set(inc.map(g=>g.id));S.gym.groups=inc.concat(S.gym.groups.filter(g=>!ids.has(g.id)));if(+o.gym.rest>0&&S.gym.rest===90)S.gym.rest=+o.gym.rest;ops[0].data=cfgDoc()}
  if(o.wos&&typeof o.wos==="object")Object.keys(o.wos).forEach(id=>{S.wos[id]=clone(o.wos[id]);ops.push({path:"workouts/"+id,data:S.wos[id]})});
  if(Array.isArray(o.ggroups)){const ids=new Set(S.ggroups.map(g=>g.id));o.ggroups.forEach(g=>{if(g&&g.id&&!ids.has(g.id))S.ggroups.push(clone(g))});ops[0].data=cfgDoc()}
  if(Array.isArray(o.ngroups)){const ids=new Set(S.ngroups.map(g=>g.id));o.ngroups.forEach(g=>{if(g&&g.id&&!ids.has(g.id))S.ngroups.push(clone(g))});ops[0].data=cfgDoc()}
  if(o.todos&&typeof o.todos==="object")Object.keys(o.todos).forEach(id=>{S.todos[id]=clone(o.todos[id]);ops.push({path:"todos/"+id,data:S.todos[id]})});
  if(o.nut&&typeof o.nut==="object"){const N=NUT(),inc=clone(o.nut);["foods","recipes","meals","units"].forEach(k=>{if(inc[k]&&typeof inc[k]==="object")Object.keys(inc[k]).forEach(id=>{if(!N[k][id])N[k][id]=inc[k][id]})});
    if(!nProf()&&inc.prof)["prof","rate","pkg","fpct","tmode","gmet"].forEach(k=>{if(inc[k]!==undefined)N[k]=inc[k]});ops[0].data=cfgDoc()}
  if(o.nutri&&typeof o.nutri==="object")Object.keys(o.nutri).forEach(k=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return;S.nutri[k]=clone(o.nutri[k]);S.nutri[k].d=k;ops.push({path:"nutri/"+k,data:S.nutri[k]})});
  if(o.notes&&typeof o.notes==="object")Object.keys(o.notes).forEach(id=>{const n=clone(o.notes[id]);if(!(n.title||"").trim()&&!(n.body||"").trim())return;S.notes[id]=n;ops.push({path:"notes/"+id,data:n})});
  if(S.mode==="local"){persistLocal();return}
  if(DB&&DB.batch){pendingN++;setSync();try{await DB.batch(ops)}finally{pendingN--;setSync()}}
  else ops.forEach(op=>queueWrite(op.path,op.data));
}

  if(e.target.name==="fr"&&e.target.closest("#habit-form")){const w=e.target.value==="wk";$("#hf-daysbox").hidden=w;$("#hf-wkbox").hidden=!w;return}
  if(e.target.name==="qm"&&e.target.closest("#habit-form")){const hp=$("#hf-qhelp");if(hp)hp.textContent=e.target.value==="max"?"نقاط كاملة إذا بقيت تحت الحد، وتنقص بالنسبة كلما تجاوزته حتى تصبح صفراً عند ضعف الحد.":"النقاط بنسبة ما أنجزته من الهدف: نصف الهدف يعطي نصف النقاط.";return}
  if(e.target.id==="nt-g"){const n=S.notes[S.nt.sel];if(n){if(e.target.value)n.g=e.target.value;else delete n.g;n.saved=true;n.updated=new Date().toISOString();saveNote(n.id);drawNotesList()}return}
  if(e.target.id==="hf-g"){const ni=$("#hf-gnew");if(ni){ni.hidden=e.target.value!=="__new";if(!ni.hidden)ni.focus()}return}
  if(e.target.id==="wf-d"){const k=e.target.value;if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&k<=todayK()){S.wt.sel=k;S.wt.msg="";e.target.blur();render(true)}return}
  if(e.target.id==="me-pick"){const k=e.target.value;if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&k<=todayK()){S.mem.sel=k;if(k<memRangeStart())S.mem.range="all";e.target.blur();render(true)}}
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="td-range"){const v=+e.target.value;setHappy(S.cur,v);lastKeep=Date.now();e.target.classList.remove("unset");const l=$("#td-val");if(l)l.innerHTML=hLabel(v);return}
  if(id==="me-range"){setHappy(S.mem.sel,+e.target.value);lastKeep=Date.now();syncMemEditor();drawMemChart();drawMemList();return}
  if(id==="me-num"){const raw=e.target.value;if(raw===""){setHappy(S.mem.sel,null)}else{const v=parseFloat(raw);if(!Number.isFinite(v)||v<-100||v>100)return;setHappy(S.mem.sel,v)}lastKeep=Date.now();syncMemEditor();drawMemChart();drawMemList();return}
  if(id==="me-note"){const had=!!(S.days[S.mem.sel]&&S.days[S.mem.sel].note);setNote(S.mem.sel,e.target.value);lastKeep=Date.now();syncMemEditor();if(had!==!!(S.days[S.mem.sel]&&S.days[S.mem.sel].note))drawMemChart();drawMemList();return}
  if(id==="mem-q"){S.mem.q=e.target.value;drawMemList();return}
  if(id==="nt-title"||id==="nt-body"){const n=S.notes[S.nt.sel];if(!n)return;n[id==="nt-title"?"title":"body"]=e.target.value;n.updated=new Date().toISOString();n.saved=true;saveNote(n.id);lastKeep=Date.now();drawNotesList();return}
  if(id==="nt-q"){S.nt.q=e.target.value;drawNotesList();return}
  if(e.target.closest&&(e.target.closest("#cf-form")||e.target.closest("#fs-quick"))){const q=e.target.closest("#cf-form")?"cf":"fq",gv=x=>{const el=$("#"+q+"-"+x);const v=el?parseFloat(el.value):NaN;return Number.isFinite(v)?v:0},kel=$("#"+q+"-k"),box=$("#"+q+"-calc");if(box)box.innerHTML=macroCalc(gv("p"),gv("c"),gv("f"),kel&&kel.value!==""?kel.value:null);return}
  if(id==="fs-q"&&FS){FS.q=e.target.value;if(/[a-z]/i.test(FS.q))loadFDB();fsResults();return}
  if(id==="fs-n"&&FS&&FS.f){const v=parseFloat(e.target.value);FS.qty=Number.isFinite(v)?v:null;const t2=$("#fs-tot");if(t2)t2.innerHTML=fsTotHTML();return}
  if(id==="nu-swm"){const k=e.target.dataset.k||S.nu.cur,d=nDay(k),raw=e.target.value,v=parseInt(raw,10),sel=$("#nu-swc"),a2=ACT_BY[sel?sel.value:"18240"]||ACT_BY["18240"];
    if(raw!==""&&!(v>=0&&v<=600))return;d.act=(d.act||[]).filter(a=>a.id!=="swim");if(raw!=="")d.act.push({id:"swim",c:a2[0],n:a2[2],met:a2[1],min:v});
    saveN(k);lastKeep=Date.now();const en=energyOn(k),el=$("#nu-swk"),swE=effSwim(k);if(el)el.innerHTML=swimLine(en,swE.a,swE.def);const t2=$("#nu-tot");if(t2&&en)t2.innerHTML=L(kc0(en.stepsK+en.ex))+" سعرة فوق الراحة";return}
  if(id==="nu-steps"||id==="nu-km"){const k=e.target.dataset.k||S.nu.cur,d=nDay(k),raw=e.target.value,key=id==="nu-steps"?"steps":"km",mx=id==="nu-steps"?100000:100;
    if(raw==="")delete d[key];else{const v=id==="nu-steps"?parseInt(raw,10):parseFloat(raw);if(!Number.isFinite(v)||v<0||v>mx)return;d[key]=id==="nu-steps"?v:Math.round(v*100)/100}
    saveN(k);if(key==="steps")syncStepsHabit(k);lastKeep=Date.now();const en2=energyOn(k),el=$("#nu-stk"),es2=effSteps(k);if(el)el.innerHTML=stepsLine(en2,es2.v,es2.def,es2.hk,es2.x);const t2=$("#nu-tot");if(t2&&en2)t2.innerHTML=L(kc0(en2.stepsK+en2.ex))+" سعرة فوق الراحة";return}
  if(id==="wn"){const w=activeWo();if(w){w.note=e.target.value;lastKeep=Date.now();saveWo(w.id)}return}
  if(id&&id.indexOf("xn-")===0){setExNote(id.slice(3),e.target.value);lastKeep=Date.now();return}
  if(id&&id.indexOf("ws-")===0){const w=activeWo();if(!w)return;const p=id.split("-"),ex=w.ex[+p[1]],st=ex&&ex.sets[+p[2]];if(!st)return;st[p[3]]=e.target.value;e.target.classList.remove("need");lastKeep=Date.now();saveWo(w.id);return}
  if(id==="wf-v"||id==="wg-v"){const btn=$(id==="wf-v"?"#wf-btn":"#wg-btn");if(btn){const sv=parseFloat(btn.dataset.saved),v=parseFloat(e.target.value),has=Number.isFinite(sv),same=has&&v===sv;
    btn.disabled=same||e.target.value==="";btn.textContent=same?"محفوظ ✓":has?(id==="wf-v"?"تحديث القراءة":"تحديث الهدف"):(id==="wf-v"?"حفظ القراءة":"حفظ الهدف")}return}
  if(id&&id.indexOf("q-")===0){const hid=id.slice(2),raw=e.target.value;if(raw===""){setQ(hid,S.cur,null)}else{const v=parseFloat(raw);if(!Number.isFinite(v)||v<0)return;setQ(hid,S.cur,v)}lastKeep=Date.now();updateQRow(hid,S.cur);return}
  if(e.target.id==="sleep"){const v=parseFloat(e.target.value);const d=ensureDay(S.cur);
    if(e.target.value===""){delete d.sleep}else if(Number.isFinite(v)&&v>=0&&v<=16){d.sleep=Math.round(v*4)/4}else return;
    saveDay(S.cur)}
});
let rz=null;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.tab!=="today"&&(S.mode==="db"||S.mode==="local"))render()},200)});
// roll the date over at midnight if the page stays open
let lastToday=todayK();setInterval(()=>{const t=todayK();if(t!==lastToday){if(S.cur===lastToday)S.cur=t;if(S.nu&&S.nu.cur===lastToday)S.nu.cur=t;if(S.bc&&S.bc.sel===lastToday)S.bc.sel=t;if(S.wt&&S.wt.sel===lastToday)S.wt.sel=t;if(S.mem&&S.mem.sel===lastToday)S.mem.sel=t;lastToday=t;render()}},60000);

render();setSync();init();
})();
</script>
