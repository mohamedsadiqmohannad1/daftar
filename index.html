<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b7b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر التطور">
<style>html{color-scheme:light dark}:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:14px system-ui,sans-serif;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<title>دفتر التطور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: one narrow logbook column, today first; four views switched from a bottom bar. Instrument-panel numbers, petrol accent. */
:root{
  --bg:#eef2f3; --surface:#ffffff; --ink:#13232a; --muted:#5a6b72; --line:#d6dfe2;
  --accent:#0d6b7b; --accent-ink:#ffffff; --accent-soft:#d3e9ed; --warm:#b26f22;
  --good:#2c7a4c; --bad:#b0443a; --miss:#e2e8ea; --off:#f1f4f5;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1518; --surface:#142026; --ink:#e2ebee; --muted:#8ea1a9; --line:#23343b;
  --accent:#4cb2c3; --accent-ink:#06191d; --accent-soft:#17383f; --warm:#dfa257;
  --good:#5cbd82; --bad:#e2786a; --miss:#1c2a30; --off:#162329; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1518; --surface:#142026; --ink:#e2ebee; --muted:#8ea1a9; --line:#23343b;
  --accent:#4cb2c3; --accent-ink:#06191d; --accent-soft:#17383f; --warm:#dfa257;
  --good:#5cbd82; --bad:#e2786a; --miss:#1c2a30; --off:#162329; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
#app{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 8px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:0}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.sync.saving i{background:var(--warm)} .sync.err i{background:var(--bad)} .sync.local i{background:var(--muted)}

.view{display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-size:16px;font-weight:600}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.02em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* date bar */
.datebar{display:flex;align-items:center;gap:10px}
.datebar .d{flex:1;min-width:0}
.datebar .d h1{font-family:var(--f-display);font-weight:500;font-size:24px;line-height:1.3}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.chip-link{border:0;background:none;color:var(--accent);font-size:13px;padding:2px 0;font-weight:500}

/* today summary */
.summary{display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:8}
.ring .bgc{stroke:var(--miss)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.ring text{fill:var(--ink);font-family:var(--f-num);font-size:19px;font-weight:500}
.summary .big{font-family:var(--f-num);font-size:26px;font-weight:500}

/* habit rows */
.hlist{display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .15s,background .15s}
.hrow:hover{border-color:var(--accent)}
.hrow .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.hrow .box svg{width:16px;height:16px;stroke:var(--accent-ink);stroke-width:3;fill:none;opacity:0}
.hrow.on .box{background:var(--accent);border-color:var(--accent)}
.hrow.on .box svg{opacity:1}
.hrow .nm{flex:1;min-width:0;font-weight:500}
.hrow.on .nm{color:var(--muted)}
.hrow .st{font-size:12px;color:var(--muted);white-space:nowrap}
.hrow.dim{opacity:.7;border-style:dashed}

/* check-in */
.ci{display:flex;flex-direction:column;gap:14px}
.ci-row{display:flex;flex-direction:column;gap:6px}
.ci-row .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 0;font-family:var(--f-num);font-size:15px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper input{width:90px;text-align:center;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px;font-family:var(--f-num)}

/* habits view */
.hcard{display:flex;flex-direction:column;gap:12px}
.hhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hhead h3{font-size:16px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:0;border-inline-start:2px solid var(--line);padding-inline-start:10px}
.stat b{font-family:var(--f-num);font-weight:500;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:11px;gap:3px;direction:ltr;width:max-content}
.heat i{border-radius:3px;background:var(--off);display:block}
.heat i.s{background:var(--miss)} .heat i.d{background:var(--accent)} .heat i.x{background:transparent;outline:1px dashed var(--line);outline-offset:-1px} .heat i.n{background:transparent}
.heat-legend{display:flex;gap:12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.heat-legend span{display:inline-flex;align-items:center;gap:4px}
.heat-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* goals */
.bar{height:8px;border-radius:5px;background:var(--miss);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:5px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--good)} .pill.behind{color:var(--bad)} .pill.done{color:var(--accent)} .pill.nodata,.pill.over{color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 14px}
.kv div{display:flex;flex-direction:column}
.kv b{font-family:var(--f-num);font-weight:500}
.kv span{font-size:12px;color:var(--muted)}

/* charts */
.chart{direction:ltr;overflow-x:auto}
.chart svg{display:block}
.ax{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.grid{stroke:var(--line);stroke-width:1}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ln.a{stroke:var(--accent)} .ln.w{stroke:var(--warm)} .ln.t{stroke:var(--good);stroke-dasharray:5 4;stroke-width:1.5} .ln.p{stroke:var(--accent);stroke-dasharray:3 4;opacity:.7}
.dot.a{fill:var(--accent)} .dot.w{fill:var(--warm)}
.barr{fill:var(--accent)} .barr.cur{fill:var(--accent);opacity:.55}
.area{fill:var(--accent);opacity:.12}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--f-num);font-weight:500;font-size:24px}
.tile .delta{font-size:12px;font-family:var(--f-num)}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.insight{border-inline-start:3px solid var(--accent);padding:4px 12px 4px 0;padding-inline-start:12px}

/* empty */
.empty{display:flex;flex-direction:column;gap:14px}
.empty h2{font-family:var(--f-display);font-weight:500;font-size:20px}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:6px 14px}
.sugg button.added{border-style:solid;background:var(--accent-soft)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--accent);font-weight:600}

/* sheet */
#sheet{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--ink) 35%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;
  padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
@media (min-width:640px){#sheet{align-items:center}.sheet-card{border-radius:18px}}
.sheet-card h2{font-family:var(--f-display);font-weight:500;font-size:20px;margin-bottom:14px}
form.f{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label,.fld .lbl2{font-size:13px;color:var(--muted)}
.fld input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
.fld input.ltr{direction:ltr;text-align:right;font-family:var(--f-num)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.daypick label{display:block}
.daypick input{position:absolute;opacity:0;pointer-events:none}
.daypick span{display:block;text-align:center;border:1px solid var(--line);border-radius:9px;padding:8px 0;font-size:14px}
.daypick input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daypick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.entries{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto}
.entries div{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line)}
.err{color:var(--bad);font-size:13px}
.banner{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.wd .l{font-size:11px;color:var(--muted)}
.wd .n{font-family:var(--f-num);font-size:15px;line-height:1}
.wd .m{width:22px;height:4px;border-radius:2px;background:var(--miss);overflow:hidden;direction:ltr}
.wd .m i{display:block;height:100%;background:var(--accent)}
.wd.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wd.today .l{color:var(--accent);font-weight:600}
.wd:disabled{opacity:.4;cursor:default}
/* 7-day dots on habit rows */
.dots{display:flex;gap:3px;flex:none}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--miss)}
.dots i.d{background:var(--accent)} .dots i.o{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.ltr{direction:ltr;unicode-bidi:isolate}
.tg,.cols{display:flex;flex-direction:column;gap:18px}
.tg-main,.tg-side{display:flex;flex-direction:column;gap:18px;min-width:0}
.delta{font-family:var(--f-body)!important}
.delta .num{font-family:var(--f-num)}
.tile b .u{font-family:var(--f-body);font-size:.6em;font-weight:400}.delta .u{font-size:1em}



.pts{font-family:var(--f-num);font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;white-space:nowrap;flex:none;font-weight:500}
h3 .pts{vertical-align:middle;margin-inline-start:4px}
.xrow{display:flex;gap:6px;align-items:stretch}
.xrow .hrow{flex:1;min-width:0}
.xrow .xdel{height:auto;align-self:stretch;width:44px;font-size:18px;color:var(--muted)}
.xrow .xdel svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
.xadd{display:flex;flex-direction:column;gap:10px}
.xadd input,.wform input:not(.datein){border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;width:100%;box-sizing:border-box}
.wform{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.wform .fld{flex:1;min-width:150px}
.wform .err{flex-basis:100%;margin:0}
.wlist{display:flex;flex-direction:column;padding:6px 10px}
.wrow{display:grid;grid-template-columns:1fr auto 64px;gap:12px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 4px;text-align:start}
.wrow:last-child{border-bottom:0}
.wrow.sel{background:var(--accent-soft);border-radius:8px}
.wrow .num:last-child{text-align:left}
.down-good{color:var(--good)} .up-bad{color:var(--bad)}
.ln.faint{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 4;opacity:.55}
.ln.thin{stroke-width:1.2;opacity:.45}
.ln.w{stroke-width:2.4}

.grp{display:flex;flex-direction:column;gap:8px}
.grp+.grp{margin-top:8px}
.grp-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grp-h h3{font-size:15px;font-weight:600;flex:1;min-width:0}
.gtog{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 0;text-align:start;color:var(--ink)}
.gtog svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;flex:none;color:var(--muted);transition:transform .2s ease}
.grp.closed .gtog svg{transform:rotate(90deg)}
.gname{font-size:15px;font-weight:600;min-width:0}
.grp.closed .gbar{opacity:.8}
.gsc{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.iconbtn.sm2{width:32px;height:32px;border-radius:8px;font-size:17px;color:var(--muted)}
.iconbtn.sm2 svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.gbar{height:3px;border-radius:2px;background:var(--miss);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--accent)}
.sel{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
.fld input#hf-gnew{margin-top:6px}
.nt-ed{gap:12px}
.nt-title{border:0;border-bottom:1px solid var(--line);background:transparent;font-family:var(--f-display);font-size:21px;padding:4px 0 8px;width:100%;box-sizing:border-box;border-radius:0}
.nt-title:focus-visible{outline:none;border-bottom-color:var(--accent)}
.nt-body{min-height:320px;background:transparent;border:0;padding:4px 0;font-size:16px}
.nt-body:focus-visible{outline:none}

.gear{width:36px;height:36px}
.gear svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.gate{max-width:460px;margin:24px auto 0;width:100%;box-sizing:border-box}
.gate h2{font-family:var(--f-display);font-weight:500;font-size:22px}
.gate input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
.code{font-family:var(--f-num);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0;overflow-x:auto}
.filebtn{position:relative;overflow:hidden;cursor:pointer;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* memories */
.rng{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.rng button{border:0;background:transparent;border-radius:7px;padding:5px 11px;font-size:13px;color:var(--muted)}
.rng button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line);font-weight:600}
.mem-svg{position:relative;width:max-content}
.zero{stroke:var(--muted);stroke-width:1;opacity:.6}
.ln.z0{stroke:var(--muted);opacity:.5;stroke-width:1}
.selln{stroke:var(--warm);stroke-width:1;stroke-dasharray:3 3}
.selring{fill:none;stroke:var(--warm);stroke-width:2}
.notedot{fill:var(--surface);stroke:var(--accent);stroke-width:2.4}
.legend i.lg-note{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--accent);background:var(--surface)}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px;width:max-content;max-width:240px;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tip .th{display:flex;gap:12px;justify-content:space-between;font-family:var(--f-num)}
.tip .th b{font-family:var(--f-body)}
.tip .ex{font-family:var(--f-body);line-height:1.45;text-align:right}
.mem-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;padding:0 24px;direction:rtl}
.hv{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hvv{font-weight:600}
input[type=range].happy{width:100%;accent-color:var(--accent);margin:0;height:26px}
input[type=range].happy.unset{opacity:.4}
.scale{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:11px;color:var(--muted);margin-top:-6px}
.numin{width:160px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;font-family:var(--f-num)}
.datein{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 8px;font-family:var(--f-num)}

  #app{max-width:1040px}

  nav.tabs{position:static;background:transparent;border:0;padding:0;margin-bottom:18px}

  nav.tabs button{flex-direction:row;gap:8px;font-size:14px;padding:10px 16px;border-bottom:2px solid transparent;margin-bottom:-1px}
  nav.tabs button svg{width:18px;height:18px}
  nav.tabs button.on{border-bottom-color:var(--accent)}
  .tg{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);align-items:start;gap:22px}

  .cols>.wide{grid-column:1/-1}
}

.hrow .nmw .st{white-space:normal}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=k=>{const a=k.split("-").map(Number);return new Date(a[0],a[1]-1,a[2],12)};
const addD=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return keyOf(d)};
const diffD=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const dow=k=>parse(k).getDay();
const todayK=()=>keyOf(new Date());
const weekStartK=k=>addD(k,-((dow(k)+1)%7)); // week starts Saturday
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=(v,dp=1)=>Number.isFinite(v)?String(Math.round(v*Math.pow(10,dp))/Math.pow(10,dp)):"–";
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:NaN;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function mkFmt(o){try{return new Intl.DateTimeFormat("ar-IQ-u-nu-latn",o)}catch(e){try{return new Intl.DateTimeFormat("ar",o)}catch(e2){return {format:d=>keyOf(d)}}}}
const F_LONG=mkFmt({weekday:"long",day:"numeric",month:"long"});
const F_SHORT=mkFmt({day:"numeric",month:"short"});
const F_FULL=mkFmt({day:"numeric",month:"long",year:"numeric"});
const fLong=k=>F_LONG.format(parse(k)), fShort=k=>F_SHORT.format(parse(k)), fFull=k=>F_FULL.format(parse(k));
const DAYS_ORDER=[6,0,1,2,3,4,5]; // Sat..Fri (JS getDay numbers)
const DAY_LETTER={6:"س",0:"ح",1:"ن",2:"ث",3:"ر",4:"خ",5:"ج"};
const DAY_NAME={6:"السبت",0:"الأحد",1:"الاثنين",2:"الثلاثاء",3:"الأربعاء",4:"الخميس",5:"الجمعة"};
const MOOD=["سيئ جداً","سيئ","عادي","جيد","ممتاز"];
const ENERGY=["منهك","منخفضة","متوسطة","جيدة","عالية"];
const SUGG=["تمرين","قراءة 20 دقيقة","شرب الماء 3 لتر","مراجعة تقنية 30 دقيقة","نوم قبل 12","بدون سكر","مشي 8000 خطوة"];
const ICON={
  prev:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>',
  edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>'
};

/* ---------- state ---------- */
const S={habits:[],groups:[],days:{},goals:{},notes:{},mode:"loading",cur:todayK(),tab:"today"};
try{const t=localStorage.getItem("dt-tab");if(t&&["today","memories","habits","notes","goals","weight"].includes(t))S.tab=t}catch(e){}
if(["today","memories","habits","notes","goals","weight"].includes(location.hash.slice(1)))S.tab=location.hash.slice(1);

/* ---------- storage ---------- */
// Embedded sync settings. Leave null to use the in-app setup screen instead.
const EMBED_CFG={apiKey:"AIzaSyCvWqQ6Ypuqp7zfflWHQAsEkunTBTdgyUg",authDomain:"daftar-1d671.firebaseapp.com",projectId:"daftar-1d671",storageBucket:"daftar-1d671.firebasestorage.app",messagingSenderId:"922233166165",appId:"1:922233166165:web:dc0dd3b02a13a993ba37dc"};
const FB_V="12.18.0",FB_B="https://www.gstatic.com/firebasejs/"+FB_V+"/";
let DB=null,FB=null,syncErr=false,pendingN=0,userEmail="";
const dirty=new Map(),busy=new Set();
const isDirty=p=>dirty.has(p)||busy.has(p);
function setSync(){
  const el=$("#sync");if(!el)return;
  let cls="sync",txt="متزامن";
  if(S.mode==="local"){cls+=" local";txt="على هذا الجهاز فقط"}
  else if(S.mode==="loading"||S.mode==="auth"||S.mode==="setup"){txt=S.mode==="loading"?"جارٍ الفتح":"غير مسجّل";cls+=" local"}
  else if(syncErr){cls+=" err";txt="تعذّر الحفظ"}
  else if(!navigator.onLine){cls+=" saving";txt="غير متصل · محفوظ على الجهاز"}
  else if(dirty.size||busy.size||pendingN){cls+=" saving";txt="جارٍ المزامنة…"}
  el.className=cls;el.lastElementChild.textContent=txt;
}
window.addEventListener("online",setSync);window.addEventListener("offline",setSync);
function queueWrite(path,data){
  if(S.mode==="local"){persistLocal();return}
  if(!DB)return;
  const ex=dirty.get(path);if(ex)clearTimeout(ex.timer);
  dirty.set(path,{data:data,timer:setTimeout(()=>flush(path),450)});
  setSync();
}
async function doWrite(path,data){const ref=DB.doc(path);if(data===null)await ref.delete();else await ref.set(data)}
function flush(path){
  const it=dirty.get(path);if(!it)return;
  clearTimeout(it.timer);dirty.delete(path);pendingN++;setSync();
  // the database queues writes on the device at once, so the next edit never waits for the network
  doWrite(path,it.data).then(()=>{syncErr=false}).catch(e=>{syncErr=true;if(e&&e.code==="resource-exhausted")showBanner("تجاوزت حد الاستخدام اليومي المجاني لقاعدة البيانات. سيعود الحفظ غداً.")}).finally(()=>{pendingN--;setSync()});
}
function flushAll(){for(const p of Array.from(dirty.keys()))flush(p)}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushAll()});
window.addEventListener("pagehide",flushAll);

let localTimer=null;
function persistLocal(){
  clearTimeout(localTimer);
  localTimer=setTimeout(()=>{try{localStorage.setItem("dt-data",JSON.stringify({habits:S.habits,groups:S.groups,days:S.days,goals:S.goals,notes:S.notes}))}catch(e){}},250);
}
function loadLocal(){
  try{const raw=localStorage.getItem("dt-data");if(raw){const o=JSON.parse(raw);S.habits=o.habits||[];S.groups=o.groups||[];S.days=o.days||{};S.goals=o.goals||{};S.notes=o.notes||{}}}catch(e){}
}
const saveConfig=()=>queueWrite("app/config",{habits:S.habits,groups:S.groups,v:1});
const saveNote=id=>queueWrite("notes/"+id,S.notes[id]||null);
const saveDay=k=>queueWrite("days/"+k,S.days[k]);
const saveGoal=id=>queueWrite("goals/"+id,S.goals[id]||null);

let bannerMsg="";
function showBanner(m){bannerMsg=m;render()}

/* sync settings: pasted once per device, or embedded above */
function parseCfg(txt){
  const o={};["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"].forEach(k=>{
    const m=new RegExp("[\"']?"+k+"[\"']?\\s*:\\s*[\"']([^\"']+)[\"']").exec(txt||"");if(m)o[k]=m[1]});
  return o.apiKey&&o.projectId&&o.appId?o:null;
}
function getCfg(){if(EMBED_CFG)return EMBED_CFG;try{const r=localStorage.getItem("dt-fbcfg");return r?JSON.parse(r):null}catch(e){return null}}

function mkDB(M,fs,uid){
  const base="users/"+uid+"/";
  const wrap=s=>({id:s.id,exists:s.exists(),data:()=>s.data()});
  const query=q=>({orderBy:(f,d)=>query(M.query(q,M.orderBy(f,d))),limit:n=>query(M.query(q,M.limit(n))),
    onSnapshot:(n,e)=>M.onSnapshot(q,s=>n({docs:s.docs.map(wrap)}),e)});
  return {
    doc:p=>{const r=M.doc(fs,base+p);return {set:d=>M.setDoc(r,d),delete:()=>M.deleteDoc(r),onSnapshot:(n,e)=>M.onSnapshot(r,s=>n(wrap(s)),e)}},
    collection:p=>query(M.collection(fs,base+p)),
    batch:async ops=>{for(let i=0;i<ops.length;i+=400){const b=M.writeBatch(fs);ops.slice(i,i+400).forEach(o=>{const r=M.doc(fs,base+o.path);if(o.data===null)b.delete(r);else b.set(r,o.data)});await b.commit()}}
  };
}
let unsubs=[];
function startDB(db){
  DB=db;S.mode="loading";render();
  unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];
  let got={c:false,d:false,g:false,n:false};
  const ready=()=>{if(got.c&&got.d&&got.g&&got.n&&S.mode==="loading"){S.mode="db";setSync()}render()};
  const onErr=e=>{if(S.mode==="loading")S.mode="db";showBanner(e&&e.code==="permission-denied"?"قاعدة البيانات رفضت الوصول. تحقق من قواعد الأمان في الخطوة الثالثة من الإعداد.":"انقطع الاتصال بقاعدة البيانات. أعد فتح الصفحة.");setSync()};
  unsubs.push(DB.doc("app/config").onSnapshot(snap=>{
    if(!isDirty("app/config")){const d=snap.exists?snap.data():null;S.habits=d&&Array.isArray(d.habits)?JSON.parse(JSON.stringify(d.habits)):[];S.groups=d&&Array.isArray(d.groups)?JSON.parse(JSON.stringify(d.groups)):[]}
    got.c=true;ready();
  },onErr));
  unsubs.push(DB.collection("days").orderBy("d","desc").limit(1000).onSnapshot(snap=>{
    const nd={};
    snap.docs.forEach(doc=>{const p="days/"+doc.id;nd[doc.id]=isDirty(p)&&S.days[doc.id]?S.days[doc.id]:JSON.parse(JSON.stringify(doc.data()))});
    Object.keys(S.days).forEach(k=>{if(!nd[k]&&isDirty("days/"+k))nd[k]=S.days[k]});
    S.days=nd;got.d=true;ready();
  },onErr));
  unsubs.push(DB.collection("goals").onSnapshot(snap=>{
    const ng={};
    snap.docs.forEach(doc=>{const p="goals/"+doc.id;ng[doc.id]=isDirty(p)&&S.goals[doc.id]?S.goals[doc.id]:JSON.parse(JSON.stringify(doc.data()))});
    Object.keys(S.goals).forEach(k=>{const it=dirty.get("goals/"+k);if(!ng[k]&&it&&it.data!==null)ng[k]=S.goals[k]});
    S.goals=ng;got.g=true;ready();
  },onErr));
  unsubs.push(DB.collection("notes").onSnapshot(snap=>{
    const nn={};
    snap.docs.forEach(doc=>{const p="notes/"+doc.id;nn[doc.id]=isDirty(p)&&S.notes[doc.id]?S.notes[doc.id]:JSON.parse(JSON.stringify(doc.data()))});
    Object.keys(S.notes).forEach(k=>{if(nn[k])return;const it=dirty.get("notes/"+k);if((it&&it.data!==null)||(k===S.nt.sel&&!S.notes[k].saved))nn[k]=S.notes[k]});
    S.notes=nn;got.n=true;ready();
  },onErr));
}
function resetState(){S.habits=[];S.groups=[];S.days={};S.goals={};S.notes={};dirty.clear();pendingN=0}

async function init(){
  if(window.__MOCKDB){userEmail="test@example.com";startDB(window.__MOCKDB);return}
  const cfg=getCfg();
  if(!cfg){
    let localOnly=false;try{localOnly=localStorage.getItem("dt-localonly")==="1"}catch(e){}
    if(localOnly){S.mode="local";loadLocal();setSync();render();return}
    S.mode="setup";setSync();render();return;
  }
  let mods;
  try{mods=await Promise.all([import(FB_B+"firebase-app.js"),import(FB_B+"firebase-auth.js"),import(FB_B+"firebase-firestore.js")])}
  catch(e){S.mode="setup";S.setupErr="تعذّر تحميل مكتبة المزامنة. تحقق من اتصال الإنترنت ثم أعد فتح الصفحة.";render();return}
  const [AM,UM,M]=mods;
  let app;
  try{app=AM.initializeApp(cfg)}catch(e){S.mode="setup";S.setupErr="إعدادات المشروع غير صالحة. الصقها من جديد.";render();return}
  let fs;
  try{fs=M.initializeFirestore(app,{localCache:M.persistentLocalCache({tabManager:M.persistentMultipleTabManager()})})}catch(e){fs=M.getFirestore(app)}
  const auth=UM.getAuth(app);
  FB={UM:UM,auth:auth};
  UM.onAuthStateChanged(auth,user=>{
    if(!user){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];DB=null;resetState();userEmail="";S.mode="auth";setSync();render();return}
    userEmail=user.email||"";startDB(mkDB(M,fs,user.uid));
  });
}
const AUTH_ERR={"auth/invalid-credential":"البريد أو كلمة المرور غير صحيحة.","auth/wrong-password":"كلمة المرور غير صحيحة.","auth/user-not-found":"لا يوجد حساب بهذا البريد. اضغط «إنشاء حساب» أولاً.",
  "auth/email-already-in-use":"هذا البريد مسجّل مسبقاً. اضغط «دخول».","auth/weak-password":"كلمة المرور قصيرة، استخدم 6 أحرف على الأقل.","auth/invalid-email":"صيغة البريد غير صحيحة.",
  "auth/network-request-failed":"لا يوجد اتصال بالإنترنت.","auth/too-many-requests":"محاولات كثيرة. انتظر قليلاً ثم أعد المحاولة.","auth/operation-not-allowed":"تسجيل الدخول بالبريد غير مفعّل في المشروع. راجع الخطوة الثانية من الإعداد.",
  "auth/admin-restricted-operation":"إنشاء الحسابات معطّل في المشروع."};
function authHTML(){
  return '<section class="panel sec gate"><h2>تسجيل الدخول</h2><p class="muted small" style="margin:0">ادخل بالبريد وكلمة المرور نفسيهما على كل أجهزتك لتتزامن بياناتك. في أول مرة اضغط «إنشاء حساب».</p>'+
  '<form id="auth-form" class="f" autocomplete="on"><div class="fld"><label for="au-mail">البريد</label><input id="au-mail" class="ltr" type="email" autocomplete="username" required></div>'+
  '<div class="fld"><label for="au-pass">كلمة المرور</label><input id="au-pass" class="ltr" type="password" autocomplete="current-password" minlength="6" required></div>'+
  '<p class="err" id="au-err"'+(S.authMsg?"":" hidden")+'>'+esc(S.authMsg||"")+'</p>'+
  '<div class="row"><button class="btn pri" type="submit" data-mode="in">دخول</button><button class="btn" type="button" data-act="authUp">إنشاء حساب</button><button class="chip-link" type="button" data-act="authReset">نسيت كلمة المرور</button></div></form></section>';
}
function setupHTML(){
  return '<section class="panel sec gate"><h2>إعداد المزامنة</h2>'+
  '<p class="muted small" style="margin:0">الصق هنا إعدادات مشروعك كما تظهر في صفحة المشروع، أي الكتلة التي تبدأ بـ</p><pre class="code" dir="ltr">const firebaseConfig = {</pre>'+
  '<form id="setup-form" class="f"><textarea id="su-cfg" class="keep ltr" rows="9" dir="ltr" spellcheck="false" placeholder="apiKey: &quot;...&quot;,&#10;authDomain: &quot;...&quot;,&#10;projectId: &quot;...&quot;, ..."></textarea>'+
  '<p class="err" id="su-err"'+(S.setupErr?"":" hidden")+'>'+esc(S.setupErr||"")+'</p>'+
  '<div class="row"><button class="btn pri" type="submit">حفظ ومتابعة</button><button class="btn" type="button" data-act="localOnly">استخدام بدون مزامنة</button></div></form></section>';
}
async function doAuth(kind){
  const mail=($("#au-mail")||{}).value||"",pass=($("#au-pass")||{}).value||"";S.authMsg="";
  if(!FB)return;
  try{
    if(kind==="reset"){if(!mail){S.authMsg="اكتب بريدك أولاً.";render(true);return}await FB.UM.sendPasswordResetEmail(FB.auth,mail.trim());S.authMsg="أرسلنا رابط تغيير كلمة المرور إلى بريدك.";render(true);return}
    if(!mail||pass.length<6){S.authMsg="اكتب البريد وكلمة مرور من 6 أحرف على الأقل.";render(true);return}
    if(kind==="up")await FB.UM.createUserWithEmailAndPassword(FB.auth,mail.trim(),pass);
    else await FB.UM.signInWithEmailAndPassword(FB.auth,mail.trim(),pass);
  }catch(e){S.authMsg=AUTH_ERR[e&&e.code]||("تعذّر تسجيل الدخول ("+((e&&e.code)||"خطأ غير معروف")+").");render(true);const m=$("#au-mail");if(m)m.value=mail}
}

/* ---------- habit math ---------- */
const liveHabits=()=>S.habits.filter(h=>!h.archived);
const hStart=h=>h.created||todayK();
const isDone=(h,k)=>{const d=S.days[k];return !!(d&&d.h&&d.h[h.id])};
const isSched=(h,k)=>!h.days||!h.days.length||h.days.length===7||h.days.includes(dow(k));
const activeOn=(h,k)=>hStart(h)<=k&&(!h.archived||(h.archivedAt&&h.archivedAt>k));
function curStreak(h){
  const t=todayK(),st=hStart(h);let k=t,n=0;
  if(isSched(h,k)&&!isDone(h,k))k=addD(k,-1);
  for(let i=0;i<2000&&k>=st;i++,k=addD(k,-1)){if(!isSched(h,k))continue;if(isDone(h,k))n++;else break}
  return n;
}
function bestStreak(h){
  const t=todayK();let k=hStart(h),run=0,best=0;
  for(let i=0;i<3000&&k<=t;i++,k=addD(k,1)){if(!isSched(h,k))continue;if(isDone(h,k)){run++;best=Math.max(best,run)}else if(k!==t)run=0}
  return best;
}
function hRate(h,n){
  const t=todayK();let k=addD(t,-(n-1));if(k<hStart(h))k=hStart(h);let s=0,d=0;
  for(;k<=t;k=addD(k,1)){if(!isSched(h,k))continue;const dn=isDone(h,k);if(k===t&&!dn)continue;s++;if(dn)d++}
  return s?d/s:NaN;
}
function dayCounts(k){
  const t=todayK();let s=0,d=0;
  S.habits.forEach(h=>{if(!activeOn(h,k)||!isSched(h,k))return;const dn=isDone(h,k);if(k===t&&!dn)return;s++;if(dn)d++});
  return {s:s,d:d};
}
function rangeRate(a,b){let s=0,d=0;for(let k=a;k<=b;k=addD(k,1)){const c=dayCounts(k);s+=c.s;d+=c.d}return s?d/s:NaN}
function firstLogKey(){
  let f=null;S.habits.forEach(h=>{if(h.created&&(!f||h.created<f))f=h.created});
  Object.keys(S.days).forEach(k=>{if(!f||k<f)f=k});return f;
}
function schedText(h){
  if(!h.days||!h.days.length||h.days.length===7)return "كل يوم";
  return DAYS_ORDER.filter(d=>h.days.includes(d)).map(d=>DAY_NAME[d]).join("، ");
}

/* ---------- goal math ---------- */
function gStats(g){
  const pts=[{d:g.startDate,v:+g.start}].concat((g.entries||[]).map(e=>({d:e.d,v:+e.v}))).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  const last=pts[pts.length-1],cur=last.v,span=g.target-g.start,dir=Math.sign(span)||1;
  const prog=span===0?1:(cur-g.start)/span;
  const reached=dir>0?cur>=g.target:cur<=g.target;
  const t=todayK(),daysLeft=diffD(t,g.deadline);
  const need=(g.target-cur)/Math.max(daysLeft,1)*7;
  const win=pts.filter(p=>diffD(p.d,last.d)<=28);
  let slope=null;
  if(win.length>=2&&diffD(win[0].d,last.d)>=3){
    const xs=win.map(p=>diffD(win[0].d,p.d)),ys=win.map(p=>p.v),mx=avg(xs),my=avg(ys);
    let nu=0,de=0;xs.forEach((x,i)=>{nu+=(x-mx)*(ys[i]-my);de+=(x-mx)*(x-mx)});
    if(de>0)slope=nu/de;
  }
  const proj=slope==null?null:cur+slope*Math.max(diffD(last.d,g.deadline),0);
  let status;
  if(reached)status="done";else if(daysLeft<0)status="over";else if(slope==null)status="nodata";
  else status=(dir>0?proj>=g.target:proj<=g.target)?"ok":"behind";
  return {pts:pts,last:last,cur:cur,prog:prog,daysLeft:daysLeft,need:need,slope:slope,proj:proj,status:status,dir:dir};
}

/* generic interactive daily curve: o={st,n,pts:[{i,k,v,mark}],yMin,yMax,yTicks,zero,area,faint:[[i,v]],avg:[[i,v]],sel,tip(p),onPick(k),empty,thin} */
function curve(box,o){
  const W=Math.max(260,Math.floor(box.clientWidth)),H=W<520?230:290,P={l:46,r:14,t:14,b:28},iw=W-P.l-P.r,ih=H-P.t-P.b;
  const n=Math.max(1,o.n),X=i=>P.l+i/n*iw,Y=v=>P.t+(o.yMax-v)/(o.yMax-o.yMin)*ih,pts=o.pts;
  const t=todayK();
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||"")+'">';
  o.yTicks.forEach(tk=>{s+='<line class="'+(o.zero!=null&&tk[0]===o.zero?"zero":"grid")+'" x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+Y(tk[0]).toFixed(1)+'" y2="'+Y(tk[0]).toFixed(1)+'"/><text class="ax" x="'+(P.l-6)+'" y="'+(Y(tk[0])+4).toFixed(1)+'" text-anchor="end">'+esc(tk[1])+'</text>'});
  const cnt=Math.max(1,Math.min(n,Math.floor(iw/72)));
  for(let j=0;j<=cnt;j++){const i=Math.round(j*n/cnt),anc=j===0?"start":j===cnt?"end":"middle";s+='<text class="ax" x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+anc+'">'+fNum(addD(o.st,i))+'</text>'}
  const si=o.sel?diffD(o.st,o.sel):-1;
  if(si>=0&&si<=n)s+='<line class="selln" x1="'+X(si).toFixed(1)+'" x2="'+X(si).toFixed(1)+'" y1="'+P.t+'" y2="'+(P.t+ih)+'"/>';
  if(o.faint&&o.faint.length>1)s+='<polyline class="ln faint" points="'+o.faint.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")+'"/>';
  if(pts.length>1){
    if(o.area!=null)s+='<path class="area" d="M'+X(pts[0].i).toFixed(1)+' '+Y(o.area).toFixed(1)+pts.map(p=>' L'+X(p.i).toFixed(1)+' '+Y(p.v).toFixed(1)).join("")+' L'+X(pts[pts.length-1].i).toFixed(1)+' '+Y(o.area).toFixed(1)+' Z"/>';
    s+='<polyline class="ln a'+(o.thin?" thin":"")+'" points="'+pts.map(p=>X(p.i).toFixed(1)+","+Y(p.v).toFixed(1)).join(" ")+'"/>';
  }
  if(o.avg&&o.avg.length>1)s+='<polyline class="ln w" points="'+o.avg.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")+'"/>';
  const r=n>200?2:n>100?2.6:3.2;
  pts.forEach(p=>{if(p.mark)s+='<circle class="notedot" cx="'+X(p.i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(r+2.2)+'"/>';else s+='<circle class="dot a" cx="'+X(p.i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+r+'"/>'});
  const sp=pts.find(p=>p.k===o.sel);if(sp)s+='<circle class="selring" cx="'+X(sp.i).toFixed(1)+'" cy="'+Y(sp.v).toFixed(1)+'" r="'+(r+6)+'"/>';
  s+='</svg>';
  box.innerHTML='<div class="mem-svg">'+s+'<div class="tip" hidden></div>'+(pts.length?"":'<div class="mem-empty">'+esc(o.empty||"لا توجد بيانات في هذه الفترة.")+'</div>')+'</div>';
  const svg=box.querySelector("svg"),tip=box.querySelector(".tip");
  const near=ev=>{const rc=svg.getBoundingClientRect(),x=(ev.clientX-rc.left)*(W/rc.width);let best=null,bd=1e9;
    pts.forEach(p=>{const dx=Math.abs(X(p.i)-x);if(dx<bd){bd=dx;best=p}});
    const di=Math.max(0,Math.min(n,Math.round((x-P.l)/iw*n)));return {p:bd<=16?best:null,k:addD(o.st,di)}};
  const show=p=>{tip.innerHTML=o.tip(p);tip.hidden=false;const tw=tip.offsetWidth,th=tip.offsetHeight;
    tip.style.left=Math.max(0,Math.min(W-tw,X(p.i)-tw/2))+"px";tip.style.top=Math.max(0,Y(p.v)-th-14)+"px"};
  svg.addEventListener("pointermove",ev=>{if(ev.pointerType==="touch")return;const q=near(ev);if(q.p)show(q.p);else tip.hidden=true});
  svg.addEventListener("pointerleave",ev=>{if(ev.pointerType!=="touch")tip.hidden=true});
  svg.addEventListener("click",ev=>{const q=near(ev),k=q.p?q.p.k:q.k;if(k<=t&&o.onPick)o.onPick(k)});
  if(sp&&o.pinTip)show(sp);
}

}

  const embedded=!!EMBED_CFG;
  return '<h2>الإعدادات</h2><div class="f">'+
    (S.mode==="db"?'<div class="fld"><span class="lbl2">الحساب</span><div class="row" style="justify-content:space-between"><bdi class="ltr">'+esc(userEmail)+'</bdi><button class="btn sm" data-act="signOut">تسجيل الخروج</button></div><span class="lbl">بياناتك تتزامن بين كل الأجهزة التي تدخل منها بهذا الحساب، وتُحفظ على الجهاز حين ينقطع الإنترنت.</span></div>'
      :S.mode==="local"?'<div class="fld"><span class="lbl2">المزامنة</span><span class="small">البيانات محفوظة على هذا الجهاز فقط.</span><div class="row"><button class="btn sm" data-act="syncSetup">إعداد المزامنة</button></div></div>':"")+
    '<div class="fld"><span class="lbl2">نسخة احتياطية</span><div class="row"><button class="btn sm" data-act="export">تصدير ملف</button><label class="btn sm filebtn">استيراد ملف<input id="imp-file" type="file" accept=".json,application/json"></label></div>'+
      '<span class="lbl">الاستيراد يضيف محتوى الملف إلى بياناتك الحالية ولا يحذف شيئاً منها. استخدمه لنقل بياناتك من النسخة القديمة.</span><p class="err" id="imp-err" hidden></p></div>'+
    (!embedded&&S.mode==="db"?'<div class="fld"><span class="lbl2">مشروع المزامنة</span><div class="row"><button class="btn sm danger" data-act="resetCfg">تغيير إعدادات المشروع على هذا الجهاز</button></div></div>':"")+
    '<div class="row"><button class="btn" data-act="closeSheet">إغلاق</button></div></div>';
}
let IMP=null;
function importSummary(o){
  const n=x=>x&&typeof x==="object"?(Array.isArray(x)?x.length:Object.keys(x).length):0;
  return '<h2>استيراد نسخة احتياطية</h2><div class="f"><div class="kv"><div><b>'+n(o.days)+'</b><span>يوماً مسجّلاً</span></div><div><b>'+n(o.habits)+'</b><span>مهمة ثابتة</span></div><div><b>'+n(o.groups)+'</b><span>مجموعة</span></div><div><b>'+n(o.goals)+'</b><span>هدفاً</span></div><div><b>'+n(o.notes)+'</b><span>فكرة</span></div></div>'+
    '<p class="small muted" style="margin:0">الأيام الموجودة في الملف وفي بياناتك معاً تُدمج، وقيم الملف تحل محل القيم المختلفة في اليوم نفسه.</p>'+
    '<p class="err" id="imp-err2" hidden></p><div class="row"><button class="btn pri" data-act="impGo">استيراد</button><button class="btn" data-act="closeSheet">إلغاء</button></div></div>';
}
async function applyImport(o){
  const clone=x=>JSON.parse(JSON.stringify(x));const ops=[];
  if(Array.isArray(o.groups)){const ids=new Set(S.groups.map(g=>g.id));o.groups.forEach(g=>{if(g&&g.id&&!ids.has(g.id))S.groups.push(clone(g))})}
  if(Array.isArray(o.habits)){o.habits.forEach(h=>{if(!h||!h.id)return;const i=S.habits.findIndex(x=>x.id===h.id);if(i>=0)S.habits[i]=clone(h);else S.habits.push(clone(h))})}
  ops.push({path:"app/config",data:{habits:S.habits,groups:S.groups,v:1}});
  if(o.days&&typeof o.days==="object")Object.keys(o.days).forEach(k=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return;const v=clone(o.days[k]),cur=S.days[k]||{};
    S.days[k]=Object.assign({},cur,v,{d:k,h:Object.assign({},cur.h||{},v.h||{})});ops.push({path:"days/"+k,data:S.days[k]})});
  if(o.goals&&typeof o.goals==="object")Object.keys(o.goals).forEach(id=>{S.goals[id]=clone(o.goals[id]);ops.push({path:"goals/"+id,data:S.goals[id]})});
  if(o.notes&&typeof o.notes==="object")Object.keys(o.notes).forEach(id=>{const n=clone(o.notes[id]);if(!(n.title||"").trim()&&!(n.body||"").trim())return;S.notes[id]=n;ops.push({path:"notes/"+id,data:n})});
  if(S.mode==="local"){persistLocal();return}
  if(DB&&DB.batch){pendingN++;setSync();try{await DB.batch(ops)}finally{pendingN--;setSync()}}
  else ops.forEach(op=>queueWrite(op.path,op.data));
}
/* ---------- events ---------- */
const confirmArm={};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  clickForce=true;try{
  switch(a){
    case "tab":S.tab=b.dataset.t;try{localStorage.setItem("dt-tab",S.tab)}catch(er){}render(true);window.scrollTo(0,0);break;
    case "day":{let k=addD(S.cur,+b.dataset.n);if(k>todayK())k=todayK();S.cur=k;render();break}
    case "pick":{const k=b.dataset.k;if(k&&k<=todayK()){S.cur=k;render()}break}
    case "goToday":S.cur=todayK();render();break;
    case "toggle":toggleHabit(id);break;
    case "rate":{const d=ensureDay(S.cur),key=b.dataset.key,v=+b.dataset.v;if(d[key]===v)delete d[key];else d[key]=v;saveDay(S.cur);render();break}
    case "sleepStep":{const d=ensureDay(S.cur);let v=Number.isFinite(d.sleep)?d.sleep:7;if(Number.isFinite(d.sleep))v+= +b.dataset.n;v=Math.max(0,Math.min(16,v));d.sleep=v;saveDay(S.cur);render();break}
    case "sugg":{const n=b.dataset.n;const ex=S.habits.find(h=>h.name===n&&!h.archived);if(!ex){addHabit(n,[]);render()}break}
    case "newHabit":openHabit(null);break;
    case "gColl":{const ck=b.dataset.k;if(COLL.has(ck))COLL.delete(ck);else COLL.add(ck);try{localStorage.setItem("dt-coll",JSON.stringify(Array.from(COLL)))}catch(er){}render();break}
    case "newHabitIn":openHabit(null,b.dataset.g||"");break;
    case "newGroup":openGroup(null);break;
    case "editGroup":{const g=S.groups.find(x=>x.id===id);if(g)openGroup(g);break}
    case "grMove":{const i=S.groups.findIndex(x=>x.id===id),j=i+(+b.dataset.n);if(i>=0&&j>=0&&j<S.groups.length){const t2=S.groups[i];S.groups[i]=S.groups[j];S.groups[j]=t2;saveConfig();card.innerHTML=groupForm(S.groups[j]);render()}break}
    case "grDel":{if(confirmArm[a+id]){S.groups=S.groups.filter(x=>x.id!==id);S.habits.forEach(h=>{if(h.g===id)delete h.g});saveConfig();closeSheet();render();delete confirmArm[a+id]}else{confirmArm[a+id]=1;b.textContent="اضغط مرة أخرى لتأكيد الحذف";setTimeout(()=>{delete confirmArm[a+id];if(b.isConnected)b.textContent="حذف المجموعة"},4000)}break}
    case "ntNew":{if(S.nt.sel)cleanupNote(S.nt.sel);const nid=uid(),now=new Date().toISOString();S.notes[nid]={id:nid,title:"",body:"",created:now,updated:now};S.nt.sel=nid;render(true);const ti=$("#nt-title");if(ti)ti.focus();break}
    case "ntOpen":openNote(id);break;
    case "ntBack":cleanupNote(S.nt.sel);S.nt.sel=null;render(true);break;
    case "ntPin":{const n=S.notes[S.nt.sel];if(n){n.pinned=!n.pinned;n.saved=true;saveNote(n.id);render(true)}break}
    case "ntDel":{const nid=S.nt.sel;if(!nid)break;if(confirmArm[a+nid]){delete S.notes[nid];saveNote(nid);S.nt.sel=null;delete confirmArm[a+nid];render(true)}else{confirmArm[a+nid]=1;b.textContent="اضغط مرة أخرى لتأكيد الحذف";setTimeout(()=>{delete confirmArm[a+nid];if(b.isConnected)b.textContent="حذف الفكرة"},4000)}break}
    case "editHabit":{const h=S.habits.find(x=>x.id===id);if(h)openHabit(h);break}
    case "archHabit":{const h=S.habits.find(x=>x.id===id);if(h){if(h.archived){h.archived=false;delete h.archivedAt}else{h.archived=true;h.archivedAt=todayK()}saveConfig();closeSheet();render()}break}
    case "delHabit":{if(confirmArm[a+id]){S.habits=S.habits.filter(x=>x.id!==id);saveConfig();closeSheet();render();delete confirmArm[a+id]}else{confirmArm[a+id]=1;b.textContent="اضغط مرة أخرى لتأكيد الحذف";setTimeout(()=>{delete confirmArm[a+id];if(b.isConnected)b.textContent="حذف نهائي"},4000)}break}
    case "newGoal":openGoal(null);break;
    case "editGoal":{const g=S.goals[id];if(g)openGoal(g);break}
    case "logGoal":{const g=S.goals[id];if(g)openLog(g);break}
    case "delGoal":{if(confirmArm[a+id]){delete S.goals[id];saveGoal(id);closeSheet();render();delete confirmArm[a+id]}else{confirmArm[a+id]=1;b.textContent="اضغط مرة أخرى لتأكيد الحذف";setTimeout(()=>{delete confirmArm[a+id];if(b.isConnected)b.textContent="حذف الهدف"},4000)}break}
    case "delEntry":{const g=S.goals[id];if(g){g.entries=(g.entries||[]).filter(x=>x.d!==b.dataset.d);saveGoal(id);card.innerHTML=logForm(g);render()}break}
    case "closeSheet":closeSheet();break;
    case "settings":openSheet(settingsHTML(),null);break;
    case "signOut":closeSheet();flushAll();if(FB)FB.UM.signOut(FB.auth);break;
    case "authUp":doAuth("up");break;
    case "authReset":doAuth("reset");break;
    case "localOnly":try{localStorage.setItem("dt-localonly","1")}catch(er){}S.mode="local";loadLocal();setSync();render(true);break;
    case "syncSetup":try{localStorage.removeItem("dt-localonly")}catch(er){}location.reload();break;
    case "resetCfg":{if(confirmArm[a]){try{localStorage.removeItem("dt-fbcfg")}catch(er){}location.reload()}else{confirmArm[a]=1;b.textContent="اضغط مرة أخرى للتأكيد";setTimeout(()=>{delete confirmArm[a]},4000)}break}
    case "impGo":{if(!IMP)break;b.disabled=true;b.textContent="جارٍ الاستيراد…";applyImport(IMP).then(()=>{IMP=null;closeSheet();render(true)}).catch(er=>{const e2=$("#imp-err2");if(e2){e2.textContent="تعذّر الاستيراد: "+((er&&er.code)||"خطأ");e2.hidden=false}b.disabled=false;b.textContent="استيراد"});break}
    case "xtoggle":{const d=ensureDay(S.cur),x=(d.x||[]).find(q=>q.id===id);if(x){x.done=!x.done;saveDay(S.cur);render()}break}
    case "xdel":{const d=ensureDay(S.cur);d.x=(d.x||[]).filter(q=>q.id!==id);if(!d.x.length)delete d.x;saveDay(S.cur);render();break}
    case "tkRange":S.tk.range=b.dataset.r;S.tk.sel=null;render();break;
    case "wtRange":S.wt.range=b.dataset.r;render();break;
    case "wall":S.wt.all=!S.wt.all;render();break;
    case "wpick":S.wt.sel=b.dataset.k;S.wt.msg="";render();break;
    case "wdel":{const k=b.dataset.k;if(confirmArm[a+k]){const d=ensureDay(k);delete d.w;saveDay(k);delete confirmArm[a+k];render()}else{confirmArm[a+k]=1;b.textContent="اضغط مرة أخرى لتأكيد الحذف";setTimeout(()=>{delete confirmArm[a+k];if(b.isConnected)b.textContent="حذف قراءة هذا اليوم"},4000)}break}
    case "toMem":S.mem.sel=S.cur;if(S.cur<memRangeStart())S.mem.range="all";S.tab="memories";try{localStorage.setItem("dt-tab",S.tab)}catch(er){}render(true);window.scrollTo(0,0);break;
    case "memRange":S.mem.range=b.dataset.r;render(true);break;
    case "memPick":{const k=b.dataset.k;const out=k<memRangeStart();S.mem.sel=k;if(out){S.mem.range="all";render(true)}else refreshMemEditor();const ed=$("#mem-ed");if(ed)ed.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});break}
    case "memClearVal":setHappy(S.mem.sel,null);render(true);break;
    case "memDel":{const k=S.mem.sel;if(confirmArm[a+k]){const d=ensureDay(k);delete d.happy;delete d.note;delete d.mood;saveDay(k);delete confirmArm[a+k];render(true)}else{confirmArm[a+k]=1;b.textContent="اضغط مرة أخرى لتأكيد الحذف";setTimeout(()=>{delete confirmArm[a+k];if(b.isConnected)b.textContent="حذف ذكرى هذا اليوم"},4000)}break}
    case "export":doExport();break;
  }
  }finally{clickForce=false}
});
document.addEventListener("submit",e=>{
  if(e.target.closest&&e.target.closest("#sheet"))return;
  if(e.target.id==="auth-form"){e.preventDefault();doAuth("in");return}
  if(e.target.id==="setup-form"){e.preventDefault();const c=parseCfg($("#su-cfg").value);
    if(!c){S.setupErr="لم أجد apiKey و projectId و appId في النص. انسخ الكتلة كاملة.";render(true);return}
    try{localStorage.setItem("dt-fbcfg",JSON.stringify(c))}catch(er){}location.reload();return}
  if(e.target.id==="xadd"){e.preventDefault();
    const nm=$("#xa-name"),pt=$("#xa-pts"),err=$("#xa-err"),name=(nm.value||"").trim(),p=parseInt(pt.value,10);
    if(!name){err.textContent="اكتب اسم المهمة.";err.hidden=false;nm.focus();return}
    if(!Number.isFinite(p)||p<1||p>1000){err.textContent="النقاط رقم صحيح من 1 إلى 1000.";err.hidden=false;pt.focus();return}
    const d=ensureDay(S.cur);if(!d.x)d.x=[];d.x.push({id:uid(),name:name,pts:p,done:false});saveDay(S.cur);render(true);
    const n2=$("#xa-name");if(n2)n2.focus();return}
  if(e.target.id==="wform"){e.preventDefault();
    const k=$("#wf-d").value,v=parseFloat($("#wf-v").value);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||k>todayK()){S.wt.msg="اختر يوماً حتى اليوم.";render(true);return}
    if(!Number.isFinite(v)||v<20||v>400){S.wt.msg="أدخل الوزن رقماً بين 20 و 400 كغم.";render(true);return}
    const d=ensureDay(k);d.w=Math.round(v*10)/10;saveDay(k);S.wt.sel=k;S.wt.msg="";if(k<rangeStartFor(S.wt.range,x=>!!x&&Number.isFinite(x.w)))S.wt.range="all";
    document.activeElement&&document.activeElement.blur&&document.activeElement.blur();render(true);return}
});
document.addEventListener("change",e=>{
  if(e.target.id==="imp-file"){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{let o=null;try{o=JSON.parse(r.result)}catch(er){}
      if(!o||typeof o!=="object"||!(o.days||o.habits||o.notes)){const er=$("#imp-err");if(er){er.textContent="هذا الملف ليس نسخة احتياطية من دفتر التطور.";er.hidden=false}return}
      IMP=o;card.innerHTML=importSummary(o)};r.readAsText(f);return}
  if(e.target.id==="hf-g"){const ni=$("#hf-gnew");if(ni){ni.hidden=e.target.value!=="__new";if(!ni.hidden)ni.focus()}return}
  if(e.target.id==="wf-d"){const k=e.target.value;if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&k<=todayK()){S.wt.sel=k;S.wt.msg="";e.target.blur();render(true)}return}
  if(e.target.id==="me-pick"){const k=e.target.value;if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&k<=todayK()){S.mem.sel=k;if(k<memRangeStart())S.mem.range="all";e.target.blur();render(true)}}
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="td-range"){const v=+e.target.value;setHappy(S.cur,v);lastKeep=Date.now();e.target.classList.remove("unset");const l=$("#td-val");if(l)l.innerHTML=hLabel(v);return}
  if(id==="me-range"){setHappy(S.mem.sel,+e.target.value);lastKeep=Date.now();syncMemEditor();drawMemChart();drawMemList();return}
  if(id==="me-num"){const raw=e.target.value;if(raw===""){setHappy(S.mem.sel,null)}else{const v=parseFloat(raw);if(!Number.isFinite(v)||v<-100||v>100)return;setHappy(S.mem.sel,v)}lastKeep=Date.now();syncMemEditor();drawMemChart();drawMemList();return}
  if(id==="me-note"){const had=!!(S.days[S.mem.sel]&&S.days[S.mem.sel].note);setNote(S.mem.sel,e.target.value);lastKeep=Date.now();if(had!==!!(S.days[S.mem.sel]&&S.days[S.mem.sel].note))drawMemChart();drawMemList();return}
  if(id==="mem-q"){S.mem.q=e.target.value;drawMemList();return}
  if(id==="nt-title"||id==="nt-body"){const n=S.notes[S.nt.sel];if(!n)return;n[id==="nt-title"?"title":"body"]=e.target.value;n.updated=new Date().toISOString();n.saved=true;saveNote(n.id);lastKeep=Date.now();drawNotesList();return}
  if(id==="nt-q"){S.nt.q=e.target.value;drawNotesList();return}
  if(e.target.id==="sleep"){const v=parseFloat(e.target.value);const d=ensureDay(S.cur);
    if(e.target.value===""){delete d.sleep}else if(Number.isFinite(v)&&v>=0&&v<=16){d.sleep=Math.round(v*4)/4}else return;
    saveDay(S.cur)}
});
let rz=null;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.tab!=="today")render()},200)});
// roll the date over at midnight if the page stays open
let lastToday=todayK();setInterval(()=>{const t=todayK();if(t!==lastToday){if(S.cur===lastToday)S.cur=t;lastToday=t;render()}},60000);

render();setSync();init();
})();
</script>
